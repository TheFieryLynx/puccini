  - section: 3.3.3.1
    title: Grammar
    html_line: 8045
    normative_text: 'TOSCA range values have the following grammar:

      [<lower_bound>, <upper_bound>]

      In the above grammar, the pseudo values that appear in angle brackets have the following meaning:

      · lower_bound: is a required integer value that denotes the lower boundary of the range.

      · upper_bound: is a required integer value that denotes the upper boundary of the range. This value MUST be
      greater than or equal to lower_bound.'
  - section: '14.3'
    title: 'Conformance Clause 2: TOSCA processor'
    html_line: 48439
    normative_text: 'A processor or program conforms to this specification as TOSCA processor if it satisfies all
      the statements below:

      (a) It can parse and recognize the elements of any conforming TOSCA YAML service template, and generates errors
      for those documents that fail to conform as TOSCA YAML service template while clearly intending to.

      (b) It implements the requirements and semantics associated with the definitions and grammar in section 3
      “TOSCA Simple Profile definitions in YAML”, including those listed in the “additional requirements” subsections.

      (c) It resolves the imports, either explicit or implicit, as described in section 3 “TOSCA Simple Profile
      definitions in YAML”.

      (d) It generates errors as required in error cases described in sections 3.1 (TOSCA Namespace URI and alias),
      3.2 (Parameter and property type) and 3.6 (Type-specific definitions).

      (e) It normalizes string values as described in section 5.4.9.3 (Additional Requirements)'
  - section: '14.4'
    title: 'Conformance Clause 3: TOSCA orchestrator'
    html_line: 48473
    normative_text: 'A processor or program conforms to this specification as TOSCA orchestrator if it satisfies
      all the statements below:

      (a) It is conforming as a TOSCA Processor as defined in conformance clause 2: TOSCA Processor.

      (b) It can process all types of artifact described in section 5.3 “Artifact types” according to the rules
      and grammars in this section.

      (c) It can process TOSCA archives as intended in section 6 “TOSCA Cloud Service Archive (CSAR) format” and
      other related normative sections.

      (d) It can understand and process the functions defined in section 4 “TOSCA functions” according to their
      rules and semantics.

      (e) It can understand and process the normative type definitions according to their semantics and requirements
      as described in section 5 “TOSCA normative type definitions”.

      (f) It can understand and process the networking types and semantics defined in section 7 “TOSCA Networking”.

      (g) It generates errors as required in error cases described in sections 2.10 (Using node template substitution
      for chaining subsystems), 5.4 (Capabilities Types) and 5.7 (Interface Types).).'
  - section: '14.6'
    title: 'Conformance Clause 5: TOSCA archive'
    html_line: 48534
    normative_text: 'A package artifact conforms to this specification as TOSCA archive if it satisfies all the
      statements below:

      (a) It is valid according to the structure and rules defined in section 6 “TOSCA Cloud Service Archive (CSAR)
      format”.

      Appendix A. Known Extensions to TOSCA v1.0

      The following items will need to be reflected in the TOSCA (XML) specification to allow for isomorphic mapping
      between the XML and YAML service templates.

      A.1 Model Changes

      · The “TOSCA Simple ‘Hello World’” example introduces this concept in Section 2. Specifically, a VM image
      assumed to accessible by the cloud provider.

      · Introduce template Input and Output parameters

      · The “Template with input and output parameter” example introduces concept in Section 2.1.1.

      · “Inputs” could be mapped to BoundaryDefinitions in TOSCA v1.0. Maybe needs some usability enhancement and
      better description.

      · “outputs” are a new feature.

      · Grouping of Node Templates

      · This was part of original TOSCA proposal, but removed early on from v1.0 This allows grouping of node templates
      that have some type of logically managed together as a group (perhaps to apply a scaling or placement policy).

      · Lifecycle Operation definition independent/separate from Node Types or Relationship types (allows reuse).
      For now, we added definitions for “node.lifecycle” and “relationship.lifecycle”.

      · Override of Interfaces (operations) in the Node Template.

      · Service Template Naming/Versioning

      · Should include TOSCA spec. (or profile) version number (as part of namespace)

      · Allow the referencing artifacts using a URL (e.g., as a property value).

      · Repository definitions in Service Template.

      · Substitution mappings for Topology template.

      · Addition of Group Type, Policy Type, Group def., Policy def. along with normative TOSCA base types for policies
      and groups.

      · Addition of Artifact Processors (AP) as first class citizens

      A.2 Normative Types

      · Types / Property / Parameters

      o list, map, range, scalar-unit types

      o Includes YAML intrinsic types

      o NetworkInfo, PortInfo, PortDef, PortSpec, Credential

      o TOSCA Version based on Maven

      o JSON and XML types (with schema constraints)

      · Constraints

      o constraint clauses, regex

      o External schema support

      · Node

      o Root, Compute, ObjectStorage, BlockStorage, Network, Port, SoftwareComponent, WebServer, WebApplicaton,
      DBMS, Database, Container, and others

      · Relationship

      o Root, DependsOn, HostedOn, ConnectsTo, AttachesTo, RoutesTo, BindsTo, LinksTo and others

      · Artifact

      o Deployment: Image Types (e.g., VM, Container), ZIP, TAR, etc.

      o Implementation : File, Bash, Python, etc.


      · Artifact Processors

      o New in v1.2 as “first class” citizen

      · Requirements

      o None

      · Capabilities

      o Container, Endpoint, Attachment, Scalable, …

      · Lifecycle

      o Standard (for Node Types)

      o Configure (for Relationship Types)

      · Functions

      o get_input, get_attribute, get_property, get_nodes_of_type, get_operation_output and others

      o concat, token

      o get_artifact

      o from (file)

      · Groups

      o Root

      · Policies

      o Root, Placement, Scaling, Update, Performance

      · Workflow

      o Complete declarative task-based workflow grammar.

      · Service Templates

      o Advanced “import” concepts

      o Repository definitions

      · CSAR

      o Allow multiple top-level Service Templates in same CSAR (with equivalent functionality)


