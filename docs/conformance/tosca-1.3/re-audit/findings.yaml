  normative_basis:
  - section: '5.2'
    title: TOSCA normative type names
    html_line: 29281
    normative_text: 'Every normative type has three names declared:

      1. Type URI – This is the unique identifying name for the type.

      a. These are reserved names within the TOSCA namespace.

      2. Shorthand Name – This is the shorter (simpler) name that can be used in place of its corresponding, full
      Type URI name.

      a. These are reserved names within TOSCA namespace that MAY be used in place of the full Type URI.

      b. Profiles of the OASIS TOSCA Simple Profile specifcaition SHALL assure non-collision of names for new types
      when they are introduced.

      c. TOSCA type designers SHOULD NOT create new types with names that would collide with any TOSCA normative
      type Shorthand Name.

      3. Type Qualified Name – This is a modified Shorthand Name that includes the “tosca:” namespace prefix which
      clearly qualifies it as being part of the TOSCA namespace.

      a. This name MAY be used to assure there is no collision when types are imported from other (non) TOSCA approved
      sources.'
  - section: 5.2.1
    title: Additional requirements
    html_line: 29328
    normative_text: '· Case sensitivity - TOSCA Type URI, Shorthand and Type Qualified names SHALL be treated as
      case sensitive.

      o The case of each type name has been carefully selected by the TOSCA working group and TOSCA orchestrators
      and processors SHALL strictly recognize the name casing as specified in this specification or any of its approved
      profiles.'
