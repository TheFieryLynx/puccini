  description: AttributeDefinition.Inherit only copies the parent validation clause when the child has none. Base
    >=10 plus child <=20 therefore accepts 5, violating the allowed additive refinement semantics.
  production_files:
  - tosca/grammars/tosca_v2_0/attribute-definition.go
  - tosca/grammars/tosca_v1_3/property-definition.go
  expected_phase: inheritance, then rendering
  old_requirement_ids:
  - TOSCA13-3.6.10.6-014
  independent_requirement_ids:
  - RA13-3.6.10.6-constraints-refinement
  probes:
  - name: refine-constraints-5
    specification_version: tosca_simple_yaml_1_3
    expected: 'reject: violates inherited >=10'
    source: "tosca_definitions_version: tosca_simple_yaml_1_3\nnode_types:\n  Base:\n    derived_from: tosca.nodes.Root\n\
      \    properties:\n      p:\n        type: integer\n        constraints:\n        - greater_or_equal: 10\n\
      \  Child:\n    derived_from: Base\n    properties:\n      p:\n        constraints:\n        - less_or_equal:\
      \ 20\ntopology_template:\n  node_templates:\n    n:\n      type: Child\n      properties:\n        p: 5\n"
    actual:
      accepted: true
      diagnostics: ''
      file: refine-constraints-5.yaml
      nodes:
        n:
          properties:
            p: 5
  - name: refine-constraints-15
    specification_version: tosca_simple_yaml_1_3
    expected: 'accept: satisfies both constraints'
    source: "tosca_definitions_version: tosca_simple_yaml_1_3\nnode_types:\n  Base:\n    derived_from: tosca.nodes.Root\n\
      \    properties:\n      p:\n        type: integer\n        constraints:\n        - greater_or_equal: 10\n\
      \  Child:\n    derived_from: Base\n    properties:\n      p:\n        constraints:\n        - less_or_equal:\
      \ 20\ntopology_template:\n  node_templates:\n    n:\n      type: Child\n      properties:\n        p: 15\n"
    actual:
      accepted: true
      diagnostics: ''
      file: refine-constraints-15.yaml
      nodes:
        n:
          properties:
            p: 15
  - name: refine-constraints-25
    specification_version: tosca_simple_yaml_1_3
    expected: 'reject: violates child <=20'
    source: "tosca_definitions_version: tosca_simple_yaml_1_3\nnode_types:\n  Base:\n    derived_from: tosca.nodes.Root\n\
      \    properties:\n      p:\n        type: integer\n        constraints:\n        - greater_or_equal: 10\n\
      \  Child:\n    derived_from: Base\n    properties:\n      p:\n        constraints:\n        - less_or_equal:\
      \ 20\ntopology_template:\n  node_templates:\n    n:\n      type: Child\n      properties:\n        p: 25\n"
    actual:
      accepted: false
      diagnostics: "Problems (1)\n  file://<probe-dir>/refine-constraints-25.yaml\n    @21,9 topology_template.node_templates[\"\
        n\"].properties[\"p\"]: malformed constraint, less_or_equal constraint not satisfied: 25"
      error: parsing problems
      file: refine-constraints-25.yaml
