      The required URI string (relative or absolute) which can be used to locate the artifact’s file.

      repository

      no

      string

      The optional name of the repository definition which contains the location of the external repository that
      contains the artifact. The artifact is expected to be referenceable by its file URI within the repository.

      description

      no

      description

      The optional description for the artifact definition.

      deploy_path

      no

      string

      The file path the associated file would be deployed into within the target node’s container.

      artifact_version

      no

      string

      The version of this artifact. One use of this artifact_version is to declare the particular version of this
      artifact type, in addition to its mime_type (that is declared in the artifact type definition). Together with
      the mime_type it may be used to select a particular artifact processor for this artifact. For example a python
      interpreter that can interpret python version 2.7.0

      checksum

      no

      string

      The checksum used to validate the integrity of the artifact.

      checksum_algorithm

      no

      string

      Algorithm used to calculate the artifact checksum (e.g. MD5, SHA [Ref]). Shall be specified if checksum is
      specified for an artifact.


      properties

      no

      map of

      property

      assignments

      The optional map of property assignments associated with the artifact.'
  - section: '14.2'
    title: 'Conformance Clause 1: TOSCA YAML service template'
    html_line: 48414
    normative_text: 'A document conforms to this specification as TOSCA YAML service template if it satisfies all
      the statements below:

      (a) It is valid according to the grammar, rules and requirements defined in section 3 “TOSCA Simple Profile
      definitions in YAML”.

      (b) When using functions defined in section 4 “TOSCA functions”, it is valid according to the grammar specified
      for these functions.

      (c) When using or referring to data types, artifact types, capability types, interface types, node types,
      relationship types, group types, policy types defined in section 5 “TOSCA normative type definitions”, it
      is valid according to the definitions given in section 5.'
  - section: '14.3'
    title: 'Conformance Clause 2: TOSCA processor'
    html_line: 48439
    normative_text: 'A processor or program conforms to this specification as TOSCA processor if it satisfies all
      the statements below:

      (a) It can parse and recognize the elements of any conforming TOSCA YAML service template, and generates errors
      for those documents that fail to conform as TOSCA YAML service template while clearly intending to.

      (b) It implements the requirements and semantics associated with the definitions and grammar in section 3
      “TOSCA Simple Profile definitions in YAML”, including those listed in the “additional requirements” subsections.

      (c) It resolves the imports, either explicit or implicit, as described in section 3 “TOSCA Simple Profile
      definitions in YAML”.

      (d) It generates errors as required in error cases described in sections 3.1 (TOSCA Namespace URI and alias),
      3.2 (Parameter and property type) and 3.6 (Type-specific definitions).

      (e) It normalizes string values as described in section 5.4.9.3 (Additional Requirements)'
  description: Refinement value/finality, additive constraints and conditional checksum-algorithm presence are mandatory
