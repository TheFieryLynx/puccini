- id: F02
  severity: high
  title: Valid fixed property refinements are rejected
  specification: TOSCA 1.3
  sections:
  - 3.6.10.6
  - 3.6.14.2
  normative_basis:
  - section: 3.6.10.6
    title: Refining Property Definitions
    html_line: 12835
    normative_text: 'TOSCA allows derived types to refine properties defined in base types. A property definition
      in a derived type is considered a refinement when a property with the same name is already defined in one
      of the base types for that type.

      Property definition refinements use parameter definition grammar rather than property definition grammar.
      Specifically, this means the following:

      · The type keyname is optional. If no type is specified, the property refinement reuses the type of the property
      it refines. If a type is specified, the type must be the same as the type of the refined property or it must
      derive from the type of the refined property.

      · Property definition refinements support the value keyname that specifies a fixed type-compatible value to
      assign to the property. These value assignments are considered final, meaning that it is not valid to change
      the property value later (e.g. using further refinements)..

      Property refinement definitions can refine properties defined in one of base types by doing one or more of
      the following:

      · Assigning a new (compatible) type as per the rules outlined above.

      · Assigning a (final) fixed value

      · Adding a default value

      · Changing a default value

      · Adding constraints.

      · Turning an optional property into a required property.

      No other refinements are allowed.'
  - section: 3.6.14.2
    title: Grammar
    html_line: 13624
    normative_text: 'Named parameter definitions have the following grammar:

      <parameter_name>:

      type: <parameter_type>

      description: <parameter_description>

      value: <parameter_value> | { <parameter_value_expression> }

      required: <parameter_required>

      default: <parameter_default_value>

      status: <status_value>

      constraints:

      - <parameter_constraints>

      key_schema : <key_schema_definition>

      entry_schema: <entry_schema_definition>


      In addition, the following single-line grammar is supported when only a fixed value needs to be provided:

      <parameter_name>: <parameter_value> | { <parameter_value_expression> }

      This single-line grammar is equivalent to the following:

      <parameter_name>:

      value : <parameter_value> | { <parameter_value_expression> }

      In the above grammar, the pseudo values that appear in angle brackets have the following meaning:

      · parameter_name: represents the required symbolic name of the parameter as a string.

      · parameter_description: represents the optional description of the parameter.

      · parameter_type: represents the optional data type of the parameter. Note, this keyname is required for a
      TOSCA Property definition, but is not for a TOSCA Parameter definition.

      · parameter_value, parameter_value_expresssion: represent the type-compatible value to assign to the named
      parameter. Parameter values may be provided as the result from the evaluation of an expression or a function.

      · parameter_required: represents an optional boolean value (true or false) indicating whether or not the parameter
      is required. If this keyname is not present on a parameter definition, then the property SHALL be considered
      required (i.e., true) by default.

      · default_value: contains a type-compatible value that may be used as a default if not provided by another
      means.

      · status_value: a string that contains a keyword that indicates the status of the parameter relative to the
      specification or implementation.

      · parameter_constraints: represents the optional list of one or more sequenced constraint clauses on the parameter
      definition.

      · key_schema_definition: if the parameter_type is map, represents the optional schema definition for they
      keys used to identify entries in that map.

      · entry_schema_definition: if the parameter_type is map or list, represents the optional schema definition
      for the entries in that map or list.'
  description: The 1.3 reader delegates to shared PropertyDefinition without a value field. A legal fixed refinement
