  - name: fixed-refinement-default-sibling
    specification_version: tosca_simple_yaml_1_3
    expected: accept, n.p=7
    source: "tosca_definitions_version: tosca_simple_yaml_1_3\nnode_types:\n  Base:\n    derived_from: tosca.nodes.Root\n\
      \    properties:\n      p:\n        type: integer\n  Child:\n    derived_from: Base\n    properties:\n   \
