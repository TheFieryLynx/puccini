  - section: 8.5.1.1
    title: Properties
    rows:
    - - Name
      - Required
      - Type
      - Constraints
      - Description
    - - ip_version
      - 'no'
      - integer
      - 'valid_values: [4, 6] default: 4'
      - The IP version of the requested network
    - - cidr
      - 'no'
      - string
      - None
      - The cidr block of the requested network
    - - start_ip
      - 'no'
      - string
      - None
      - The IP address to be used as the 1st one in a pool of addresses derived from the cidr block full IP range
    - - end_ip
      - 'no'
      - string
      - None
      - The IP address to be used as the last one in a pool of addresses derived from the cidr block full IP range
    - - gateway_ip
      - 'no'
      - string
      - None
      - The gateway IP address.
    - - network_name
      - 'no'
      - string
      - None
      - An Identifier that represents an existing Network instance in the underlying cloud infrastructure – OR –
        be used as the name of the new created network. · If network_name is provided along with network_id they
        will be used to uniquely identify an existing network and not creating a new one, means all other possible
        properties are not allowed. · network_name should be more convenient for using. But in case that network
        name uniqueness is not guaranteed then one should provide a network_id as well.
    - - network_id
      - 'no'
      - string
      - None
      - An Identifier that represents an existing Network instance in the underlying cloud infrastructure. This
        property is mutually exclusive with all other properties except network_name. · Appearance of network_id
        in network template instructs the Tosca container to use an existing network instead of creating a new one.
        · network_name should be more convenient for using. But in case that network name uniqueness is not guaranteed
        then one should add a network_id as well. · network_name and network_id can be still used together to achieve
        both uniqueness and convenient.
    - - segmentation_id
      - 'no'
      - string
      - None
      - A segmentation identifier in the underlying cloud infrastructure (e.g., VLAN id, GRE tunnel id). If the
        segmentation_id is specified, the network_type or physical_network properties should be provided as well.
    - - network_type
      - 'no'
      - string
      - None
      - Optionally, specifies the nature of the physical network in the underlying cloud infrastructure. Examples
        are flat, vlan, gre or vxlan. For flat and vlan types, physical_network should be provided too.
    - - physical_network
      - 'no'
      - string
      - None
      - Optionally, identifies the physical network on top of which the network is implemented, e.g. physnet1. This
        property is required if network_type is flat or vlan.
    - - dhcp_enabled
      - 'no'
      - boolean
      - 'default: true'
      - Indicates the TOSCA container to create a virtual network instance with or without a DHCP service.
