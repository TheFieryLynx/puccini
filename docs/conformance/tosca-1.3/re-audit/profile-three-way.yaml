    return nil\n\t\t}\n\t\tif x, ok := v.Interface().(*v20.RangeEntity); ok { return clean(reflect.ValueOf(x.Range),\
    \ depth+1) }\n\t\tif x, ok := v.Interface().(*v20.Range); ok { return map[string]any{\"lower\": x.Lower, \"\
    upper\": x.Upper} }\n\t\tif x, ok := v.Interface().(*v20.Value); ok {\n\t\t\treturn clean(reflect.ValueOf(x.Context.Data),\
    \ depth+1)\n\t\t}\n\t\tif x, ok := v.Interface().(*v20.ValidationClause); ok {\n\t\t\treturn clean(reflect.ValueOf(x.Context.Data),\
    \ depth+1)\n\t\t}\n\t\treturn clean(v.Elem(), depth+1)\n\t}\n\tswitch v.Kind() {\n\tcase reflect.Struct:\n\t\
    \tm := map[string]any{}\n\t\tt := v.Type()\n\t\tfor i := 0; i < v.NumField(); i++ {\n\t\t\tf := t.Field(i)\n\
    \t\t\tif f.PkgPath != \"\" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif f.Anonymous {\n\t\t\t\tif x, ok := clean(v.Field(i),\
    \ depth+1).(map[string]any); ok {\n\t\t\t\t\tfor k, z := range x {\n\t\t\t\t\t\tm[k] = z\n\t\t\t\t\t}\n\t\t\t\
    \t}\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\ttag := strings.Split(f.Tag.Get(\"read\"), \",\")[0]\n\t\t\tif tag == \"\
    \" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tx := clean(v.Field(i), depth+1)\n\t\t\tif x != nil {\n\t\t\t\tm[tag]\
    \ = x\n\t\t\t}\n\t\t}\n\t\treturn m\n\tcase reflect.Map:\n\t\tif v.IsNil() {\n\t\t\treturn nil\n\t\t}\n\t\t\
    m := map[string]any{}\n\t\tit := v.MapRange()\n\t\tfor it.Next() {\n\t\t\tm[fmt.Sprint(it.Key().Interface())]\
    \ = clean(it.Value(), depth+1)\n\t\t}\n\t\treturn m\n\tcase reflect.Slice, reflect.Array:\n\t\ta := []any{}\n\
    \t\tfor i := 0; i < v.Len(); i++ {\n\t\t\ta = append(a, clean(v.Index(i), depth+1))\n\t\t}\n\t\treturn a\n\t\
    default:\n\t\treturn v.Interface()\n\t}\n}\nfunc main() {\n\tu := exturl.NewContext()\n\tdefer u.Release()\n\
    \tp := parser.NewParser().NewContext()\n\tp.Quirks = parsing.Quirks{parsing.QuirkImportsImplicitDisable}\n data,\
    \ err := os.ReadFile(os.Args[1]); if err != nil {panic(err)}\n prim, err := os.ReadFile(os.Args[2]); if err\
    \ != nil {panic(err)}\n if err := exturl.RegisterInternalURL(\"/profiles/simple/1.3/audit-oasis.yaml\", data);\
    \ err != nil {panic(err)}\n if err := exturl.RegisterInternalURL(\"/profiles/audit-oasis/primitives.yaml\",\
    \ prim); err != nil {panic(err)}\n if err := exturl.RegisterInternalURL(\"/profiles/audit-oasis/root.yaml\"\
    , \"tosca_definitions_version: tosca_simple_yaml_1_3\\nimports:\\n- internal:/profiles/simple/1.3/audit-oasis.yaml\\\
    n\"); err != nil {panic(err)}\n p.URL = u.NewInternalURL(\"/profiles/audit-oasis/root.yaml\")\n\t_, e := p.Parse(context.Background())\n\
    \tif e != nil {\n\t\tfmt.Fprintln(os.Stderr, e, p.GetProblems().ToString(false))\n\t\tos.Exit(1)\n\t}\n\tout\
    \ := map[string]any{}\n\tfor _, f := range p.Files {\n\t\tvar file *v20.File\n\t\tswitch x := f.EntityPtr.(type)\
    \ {\n\t\tcase *v13.File:\n\t\t\tfile = x.File\n\t\tcase *v13.ServiceFile:\n\t\t\tfile = x.File\n\t\t}\n\t\t\
    if file == nil {\n\t\t\tcontinue\n\t\t}\n\t\tfv := reflect.ValueOf(file).Elem()\n\t\tfor _, field := range []string{\"\
    DataTypes\", \"ArtifactTypes\", \"CapabilityTypes\", \"RelationshipTypes\", \"InterfaceTypes\", \"NodeTypes\"\
