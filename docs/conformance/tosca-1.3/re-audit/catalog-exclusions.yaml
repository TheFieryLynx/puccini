- section: 13.4.7
  html_line: 48266
  text: It should be possible to use a generic interface to describe these various API attributes without being
    forced into using specific software packages or API tooling. Of course, in order to “invoke” the API an orchestrator
    must launch an API client (e.g. a python script, a Java program, etc.) that uses the appropriate API language
    bindings. However, using generic API Artifact types, the decision about which API clients and language bindings
    to use can be left to the orchestrator. It is up to the API Artifact Processor provided by the Orchestrator
    to create an execution environment within which to deploy API language bindings and associated API clients based
    on Orchestrator preferences. The API Artifact Processor then uses these API clients to “process” the API artifact.
  classification: informative
