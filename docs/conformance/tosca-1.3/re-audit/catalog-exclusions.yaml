    orchestrator: false
    generator: false
    archive: false
  basis: Informative/example context excluded by enclosing section.
- section: 2.10.3
  html_line: 4888
  text: Further note that no mappings for properties or attributes of the substituted node are defined. Instead,
    the inputs and outputs defined by the topology template are mapped to the appropriate properties and attributes
    or the substituted node. If there are more inputs than the substituted node has properties, default values must
    be defined for those inputs, since no values can be assigned through properties in a substitution case.
  classification: informative
  target:
