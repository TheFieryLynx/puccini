  basis: Informative/example context excluded by enclosing section.
- section: 2.12.3
  html_line: 5638
  text: Since both the ACME Firewall and the Simple Firewall can substitute for abstract node templates of type
    abstract.Firewall, either firewall is a valid candidate to substitute the abstract firewall node template. When
    multiple matching templates are available, the orchestrator must provide mechanisms to allow the end-user to
    drive the decision about which matching template must be selected.
