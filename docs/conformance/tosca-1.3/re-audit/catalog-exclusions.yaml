- section: '2.6'
  html_line: 3882
  text: The node type definition for the wordpress node template is WordPress which declares the complete database_endpoint
    requirement definition. This database_endpoint declaration indicates it must be fulfilled by any node template
    that provides an Endpoint.Database Capability Type using a ConnectsTo relationship. The wordpress_db node template’s
    underlying MySQL type definition indeed provides the Endpoint.Database Capability type. In this example however,
    no explicit relationship template is declared; therefore, TOSCA orchestrators would automatically create a ConnectsTo
    relationship to establish the link between the wordpress node and the wordpress_db node at runtime.
  classification: informative
  target:
    processor: false
    service_template_author: false
    orchestrator: false
    generator: false
    archive: false
  basis: Informative/example context excluded by enclosing section.
