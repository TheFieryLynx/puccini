  basis: Informative/example context excluded by enclosing section.
- section: 2.10.1
  html_line: 4583
  text: When a topology template is instantiated by a TOSCA Orchestrator, the orchestrator has to first look for
    abstract node templates in the topology template. Abstract node templates are node templates that include the
    substitute directive. These abstract node templates must then be realized using substituting service templates
    that are compatible with the node types specified for each abstract node template. Such realizations can either
    be node types that include the appropriate implementation artifacts and deployment artifacts that can be used
    by the orchestrator to bring to life the real-world resource modeled by a node template. Alternatively, separate
    topology templates may be annotated as being suitable for realizing a node template in the top-level topology
    template.
  classification: informative
  target:
    processor: false
    service_template_author: false
    orchestrator: false
    generator: false
    archive: false
  basis: Informative/example context excluded by enclosing section.
- section: 2.10.2
