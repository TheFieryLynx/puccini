- section: '8.1'
  html_line: 39394
  text: TOSCA Service Templates are application centric in the sense that they focus on describing application components
    in terms of their requirements and interrelationships. In order to provide cloud portability, it is important
    that a TOSCA Service Template avoid cloud specific requirements and details. However, at the same time, TOSCA
    must provide the expressiveness to control the mapping of software component connectivity to the network constructs
    of the hosting cloud.
  classification: excluded-target
  target:
    processor: false
    service_template_author: true
    orchestrator: true
    generator: false
    archive: false
  basis: Runtime-only obligation under the orchestrator/archive conformance target.
- section: 8.3.1
  html_line: 39521
  text: Application component intercommunication typically has conventions regarding which component(s) initiate
    the communication. Connection initiation semantics are specified in tosca.capabilities.Endpoint. Endpoints at
    each end of the tosca.relationships.ConnectsTo must indicate identical connection initiation semantics.
  classification: excluded-target
  target:
    processor: false
    service_template_author: true
    orchestrator: true
    generator: false
    archive: false
  basis: Runtime-only obligation under the orchestrator/archive conformance target.
- section: 8.3.1.3
  html_line: 39607
  text: Endpoints specifying the Peer-to-Peer initiation semantic need not be related with a tosca.relationships.ConnectsTo
    relationship for the common case where the same set of component instances must communicate with each other.
  classification: excluded-target
  target:
    processor: false
    service_template_author: true
    orchestrator: true
    generator: false
    archive: false
  basis: Runtime-only obligation under the orchestrator/archive conformance target.
- section: 8.3.2
  html_line: 39621
  text: TOSCA Service Templates must express enough details about application component intercommunication to enable
    TOSCA implementations to fulfill these communication semantics in the network infrastructure. TOSCA currently
    focuses on TCP/IP as this is the most pervasive in today’s cloud infrastructures. The layer 4 ports required
    for application component intercommunication are specified in tosca.capabilities.Endpoint. The union of the
    port specifications of both the source and target tosca.capabilities.Endpoint which are part of the tosca.relationships.ConnectsTo
    Relationship Template are interpreted as the effective set of ports which must be allowed in the network communication.
  classification: excluded-target
  target:
    processor: false
    service_template_author: true
    orchestrator: true
    generator: false
    archive: false
  basis: Runtime-only obligation under the orchestrator/archive conformance target.
- section: 8.4.1
  html_line: 39645
  text: TOSCA orchestrators are responsible for the provisioning of the network connectivity for declarative TOSCA
    Service Templates (Declarative TOSCA Service Templates don’t contain explicit plans). This means that the TOSCA
    orchestrator must be able to infer a suitable logical connectivity model from the Service Template and then
    decide how to provision the logical connectivity, referred to as “fulfillment”, on the available underlying
    infrastructure. In order to enable fulfillment, sufficient technical details still must be specified, such as
    the required protocols, ports and QOS information. TOSCA connectivity types, such as tosca.capabilities.Endpoint,
    provide well defined means to express these details.
  classification: excluded-target
  target:
    processor: false
    service_template_author: true
    orchestrator: true
    generator: false
    archive: false
  basis: Runtime-only obligation under the orchestrator/archive conformance target.
- section: 12.3.2
  html_line: 46754
  text: There must be control mechanisms in place that can be part of these patterns that accept governance policies
    that allow control expressions of what is allowed when placing, scaling and managing the applications that are
    enforceable and verifiable in Cloud.
  classification: informative
