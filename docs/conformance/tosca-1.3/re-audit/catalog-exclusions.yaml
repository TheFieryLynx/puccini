  html_line: 46865
  text: This use case shows a failover policy to keep at least 3 copies running in separate containers. In this
    simple case, the specific containers to use (or name is not important; the Cloud provider must assure placement
    separation (anti-affinity) in three physically separate containers.
  classification: informative
  target:
    processor: false
    service_template_author: false
