- section: 2.9.1
  html_line: 4272
  text: In the example above, the mysql component contains a host requirement for a node of type Compute which it
    inherits from its parent DBMS node type definition; however, there is no declaration or reference to any node
    template of type Compute. Instead, the mysql node template augments the abstract “host” requirement with a node_filter
    which contains additional selection criteria (in the form of property constraints that the provider must use
    when selecting or allocating a host Compute node.
  classification: informative
