- section: 3.8.8.3
  html_line: 23579
  text: '· The previous version of the specification allowed direct mappings from properties of the abstract node
    template to properties of node templates in the substituting topology template. Support for these mappings has
    been deprecated since they would have resulted in unpredictable behavior, for the following reason. If the substituting
    template is a valid TOSCA template, then all the (required) properties of all its node templates must have valid
    property assignments already defined. If the substitution mappings of the substituting template include direct
    property-to-property mappings, the the substituting template ends up with two conflicting property assignments:
    one defined in the substituting template itself, and one defined by the substitution mappings. These conflicting
    assignments lead to unpredictable behavior.'
  classification: pending-review
  target:
    processor: false
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  basis: Requires individual applicability/atomicity review; not included in validated atomic count.
