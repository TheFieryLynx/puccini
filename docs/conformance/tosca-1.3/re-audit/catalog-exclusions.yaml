- section: 12.3.2.2
  html_line: 46790
  text: Companies realize that their day-to-day business must continue on through unforeseen disasters that might
    disable instances of the applications and data at or on specific data centers, networks or servers. They need
    to be able to convey placement policies for their software applications and data that mitigate risk of disaster
    by assuring these cloud assets are deployed strategically in different physical locations. Such policies need
    to consider placement across geographic locations as wide as countries, regions, datacenters, as well as granular
    placement on a network, server or device within the same physical datacenter. Cloud providers must be able to
    not only enforce these policies but provide robust and seamless failover such that a disaster’s impact is never
    perceived by the end user.
  classification: informative
  target:
    processor: false
    service_template_author: false
    orchestrator: false
    generator: false
    archive: false
  basis: Informative/example context excluded by enclosing section.
