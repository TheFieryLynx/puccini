schema_version: 1
findings:
- id: EVIDENCE-OPERATION-INHERITANCE
  severity: high
  discovered_during: F15 operation evidence hardening
  specification:
    version: '1.3'
    source: docs/specifications/tosca/1.3/TOSCA-Simple-Profile-YAML-v1.3-os.html
    sections: ['3.6.17.1', '3.6.17.3', '5.8.1']
    normative_rule: Implementation artifacts assigned in subclasses override those in the parent; implementation is optional. Providing only description does not assign an overriding artifact.
    interpretation: The absence of a new implementation preserves the inherited implementation. See the linked decision; the specification does not give a complete inheritance algorithm.
  decision: docs/decisions/tosca-1.3-operation-implementation-inheritance.md
  current_behavior: A local operation definition with description only loses the parent implementation and normalizes as an empty implementation.
  expected_behavior: Preserve parent.sh unless an overriding implementation artifact is supplied.
  parser_phase: inheritance
  production_path: OperationDefinitions.Inherit -> OperationDefinition.Inherit -> OperationAssignments.Render -> InterfaceImplementation.NormalizeOperation
  file: tosca/grammars/tosca_v2_0/operation-definition.go
  reproducer: TOSCA13-CORPUS-EVIDENCE-OPERATION-TYPE-INHERITANCE
  assertion: A4
  before_result: 'got "", expected "parent.sh"'
  discovery_commit_policy: Intentionally failing permanent regression committed separately as explicitly required by the evidence-hardening task. This is not a completed remediation commit.
  status: remediated
  discovery_commit: f38c63a2
  remediation: TOSCA 1.3 OperationDefinitionInheritor policy; neutral shared hook remains nil for 2.0.
  after_result: All operation semantic assertions pass.
  mutation_result: Disabling the 1.3 hook fails A4; original M04 overwrite fails template override A1. Both restored.
  cross_version: TestEvidenceOperationPolicyIsolation passes before and after; no change to observable 2.0 result.
  historical_mapping:
    related_ids: [TOSCA13-3.6.17.3-002, TOSCA13-5.8.1-004]
    exact_mapping: false
    reason: Omitted implementation inheritance is an interpretation of override semantics, not a separately enumerated frozen predicate. No denominator change.
- id: EVIDENCE-CREDENTIAL-TOKEN-DATA
  severity: high
  specification:
    version: '1.3'
    sections: ['5.3.6.1', '5.3.6.2', '4.3.3.1']
    normative_rule: Credential.token is a required string; token_type defaults to password. The token intrinsic function takes a sequence of three arguments.
  current_behavior: A one-entry Credential map with string token is converted into an intrinsic function and rejected at read.
  expected_behavior: Preserve string-valued token maps as data; resolve/render them against their declared type and apply token_type default.
  reproducer: TOSCA13-CORPUS-EVIDENCE-CREDENTIAL-OMITTED
  assertion: A1
  before_result: 'read: malformed token function, arguments must be a YAML sequence'
  status: remediated
  discovery_commit: 385f9fc7
  remediation: Grammar-scoped string token data predicate before shared function conversion; absent in 2.0.
  after_result: Direct and collection Credential values normalize with password default.
  mutation_result: Original M13 fails inherited-default A1; disabling literal policy fails omitted A1. Both restored.
  discovery_commit_policy: Permanent failing test intentionally committed separately under the explicit task policy.
  historical_mapping:
    related_ids: [TOSCA13-5.3.6.1-004, TOSCA13-5.3.6.1-008]
    exact_mapping: false
    reason: Default is already indexed outside the frozen denominator; function/data discrimination has no exact frozen mapping. Do not add denominator membership.
