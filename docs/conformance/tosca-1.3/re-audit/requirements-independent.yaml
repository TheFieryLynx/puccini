- id: RA13-3.6.15.1-node-output-target-value-domain
  section: 3.6.15.1
  title: Grammar
  dimension: value-domain
  subject: node-output-target
  obligation: Node operation outputs target SELF.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 13856
    evidence: '

      Attribute mappings have the following grammar :


      output_name: [ <SELF | SOURCE | TARGET >, <optional_capability_name>, <attribute_name>, <nested_attribute_name_or_index_1>,
      ..., <nested_attribute_name_or_index_or_key_n> ]


      The various entities in this grammar are defined as follows:

      Parameter

      Required

      Type

      Description

      SELF | SOURCE | TARGET

      yes

      string

      For operation outputs in interfaces on node templates, the only allowed keyname is SELF: output values must
      always be stored into attributes that belong to the node template that has the interface for which the output
      values are returned.

      For operation outputs in interfaces on relationship templates, allowable keynames are SELF, SOURCE, or TARGET.

      <optional_capability_name>

      no

      string

      The optional name of the capability within the specified node template that contains the named attribute into
      which the output value must be stored.

      <attribute_name>

      yes

      string

      The name of the attribute into which the output value must be stored.

      <nested_attribute_name_or_index_or_key_*>

      no

      string| integer

      Some TOSCA attributes are complex (i.e., composed as nested structures). These parameters are used to dereference
      into the names of these nested structures when needed.

      Some attributes represent list or map types. In these cases, an index or key may be provided to reference
      a specific entry in the list or map (as named in the previous parameter) to return.


      Note that it is possible for multiple operations to define outputs that map onto the same attribute value.
      For example, a create operation could include an output value that sets an attribute to an initial value,
      and the subsequence configure operation could then update that same attribute to a new value.


      It is also possible that a node template assigns a value to an attribute that has an operation output mapped
      to it (including a value that is the result of calling an intrinsic function). Orchestrators could use the
      assigned value for the attribute as its initial value. After the operation runs that maps an output value
      onto that attribute, the orchestrator must then use the updated value, and the value specified in the node
      template will no longer be used.

      '
  expected_phase: read
