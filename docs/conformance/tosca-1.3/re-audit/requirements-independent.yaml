- id: RA13-3.6.8.2.3-reserved-import-prefix-rejection
  section: 3.6.8.2.3
  title: Requirements
  dimension: rejection
  subject: reserved-import-prefix
  obligation: Reject tosca as namespace_prefix on an import.
  strength: implicit-mandatory
  target:
