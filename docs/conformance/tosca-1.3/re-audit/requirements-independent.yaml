    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 11902
    evidence: '· The “file” keyname’s vlue MAY be an approved TOSCA Namespace alias.

      · The namespace prefix “tosca” Is reserved and SHALL NOT be used to as a value for “namespace_prefix” on import.

      · The imports key “namespace_uri” is now deprecated. It was intended to be able to define a default namespace
      for any types that were defined within the Service Template being imported; however, with version 1.2, Service
      Templates MAY now declare their own default Namespace which SHALL be used in place of this key’s value.

      o Please note that TOSCA Orchestrators and Processors MAY still use the”namespace_uri” value if provided,
      if the imported Service Template has no declared default Namespace value. Regardless it is up to the TOSCA
      Orchestrator or Processor to resolve Namespace collisions caused by imports as they see fit, for example,
      they may treat it as an error or dynamically generate a unique namepspace themselves on import.'
  expected_phase: read
