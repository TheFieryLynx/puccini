- id: RA13-3.3.2.1-version-grammar
  section: 3.3.2.1
  title: Grammar
  dimension: grammar
  subject: version
  obligation: Validate ordered version components and optional qualifier/build suffix.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 7895
    evidence: 'TOSCA version strings have the following grammar:

      <major_version>.<minor_version>[.<fix_version>[.<qualifier>[-<build_version] ] ]

      In the above grammar, the pseudo values that appear in angle brackets have the following meaning:

      · major_version: is a required integer value greater than or equal to 0 (zero)

      · minor_version: is a required integer value greater than or equal to 0 (zero).

      · fix_version: is an optional integer value greater than or equal to 0 (zero).

      · qualifier: is an optional string that indicates a named, pre-release version of the associated code that
      has been derived from the version of the code identified by the combination major_version, minor_version and
      fix_version numbers.

      · build_version: is an optional integer value greater than or equal to 0 (zero) that can be used to further
      qualify different build versions of the code that has the same qualifer_string.'
  expected_phase: read
