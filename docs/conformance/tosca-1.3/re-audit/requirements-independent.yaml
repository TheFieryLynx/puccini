- id: RA13-5.4.5.1-tosca-artifacts-template-type-availability
  section: 5.4.5.1
  title: tosca.artifacts.template
  dimension: type-availability
  subject: tosca.artifacts.template
  obligation: Recognize this normative type by its exact case-sensitive name, category, and specified definition.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 31599
    evidence: 'This artifact type represents the parent type for all template type artifacts in TOSCA. This class
      of artifacts typically represent template files that are dependent artifacts for implementation of an interface
      or deployment of a node.

      Like the case of other dependent artifacts, the TOSCA orchestrator copies the dependent artifacts to the same
      location as the primary artifact for its access during execution. However, the template artifact processor
      need not be deployed in the environment where the primary artifact executes. At run time, the Orchestrator
      can invoke the artifact processor (i.e. template engine) to fill in run time values and provide the “filled
      template” to the primary artifact processor for further processing.

      This reduces the requirements on the primary artifact target environment and the processing time of template
      artifacts.'
  expected_phase: namespace
  qualification: Definition field atoms are represented separately by profile tables; YAML-only fields still require
    profile reconciliation.
