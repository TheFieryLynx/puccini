- id: RA13-3.1.2-version-position
  section: 3.1.2
  title: TOSCA Namespacing in TOSCA Service Templates
  dimension: position
  subject: version
  obligation: Version declaration is the first YAML entry.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 6971
    evidence: 'In the TOSCA Simple Profile, TOSCA Service Templates MUST always have, as the first line of YAML,
      the keyword “tosca_definitions_version” with an associated TOSCA Namespace Alias value. This single line accomplishes
      the following:

      1. Establishes the TOSCA Simple Profile Specification version whose grammar MUST be used to parse and interpret
      the contents for the remainder of the TOSCA Service Template.

      2. Establishes the default TOSCA Namespace URI and Namespace Prefix for all types found in the document that
      are not explicitly namespaced.

      3. Automatically imports (without the use of an explicit import statement) the normative type definitions
      (e.g., Node, Relationship, Capability, Artifact, etc.) that are associated with the TOSCA Simple Profile Specification
      the TOSCA Namespace Alias value identifies.

      4. Associates the TOSCA Namespace URI and Namespace Prefix to the automatically imported TOSCA type definitions.'
  expected_phase: read
