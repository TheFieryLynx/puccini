      · capability_definition_name: represents the symbolic name of the capability as a string.

      · property_assignments: represents the optional map of property assignments for the capability definition.

      · attribute_assignments: represents the optional map of attribute assignments for the capability definition.

      · min_occurrences, max_occurrences: lower and upper bounds of the range that further refines the minimum and
      maximum occurrences for this capability specified in the corresponding capability definition. The range specified
      here must fall completely within the occurrences range specified in the corresponding capability definition'
