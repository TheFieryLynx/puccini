- id: RA13-3.8.2.2.3-requirement-node-type-compatibility
  section: 3.8.2.2.3
  title: Extended grammar with Property Assignments for the relationship’s Interfaces
  dimension: type-compatibility
  subject: requirement-node
  obligation: The assigned node type is compatible with the corresponding requirement definition.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 21445
    evidence: 'The following additional multi-line grammar is provided for the relationship keyname in order to
      provide new Property assignments for inputs of known Interface definitions of the declared Relationship Type.

      <requirement_name>:

      # Other keynames omitted for brevity

      relationship:

      type: <relationship_template_name> | <relationship_type_name>

      properties:

      <property_assignments>

      interfaces:

      <interface_assignments>

      Examples of uses for the extended requirement assignment grammar include:

      · The need to allow runtime selection of the target node based upon an abstract Node Type rather than a concrete
      Node Template. This may include use of the node_filter keyname to provide node and capability filtering information
      to find the “best match” of a concrete Node Template at runtime.

      · The need to further clarify the concrete Relationship Template or abstract Relationship Type to use when
      relating the source node’s requirement to the target node’s capability.

      · The need to further clarify the concrete capability (symbolic) name or abstract Capability Type in the target
      node to form a relationship between.

      · The need to (further) constrain the occurrences of the requirement in the instance model.

      In the above grammars, the pseudo values that appear in angle brackets have the following meaning:

      · requirement_name: represents the symbolic name of a requirement assignment as a string.

      · node_template_name: represents the optional name of a Node Template that contains the capability this requirement
      will be fulfilled by.

      · relationship_template_name: represents the optional name of a Relationship Template to be used when relating
      the requirement appears to the capability in the target node.

      · capability_symbolic_name: represents the required named capability definition within the target Node Type
      or Template.

      · node_type_name: represents the optional name of a TOSCA Node Type the associated named requirement can be
      fulfilled by. This must be a type that is compatible with the Node Type declared on the matching requirement
      (same symbolic name) the requirement’s Node Template is based upon.

      · relationship_type_name: represents the optional name of a Relationship Type that is compatible with the
      Capability Type in the target node.

      · property_assignments: represents the optional map of property value assignments for the declared relationship.

      · interface_assignments: represents the optional map of interface definitions for the declared relationship
      used to provide property assignments on inputs of interfaces and operations.

      · capability_type_name: represents the optional name of a Capability Type definition within the target Node
      Type this requirement needs to form a relationship with.

      · node_filter_definition: represents the optional node filter TOSCA orchestrators would use to fulfill the
      requirement for selecting a target node. Note that this SHALL only be valid if the node keyname’s value is
      a Node Type and is invalid if it is a Node Template.'
  expected_phase: rendering
