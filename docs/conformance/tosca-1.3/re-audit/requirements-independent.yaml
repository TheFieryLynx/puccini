- id: RA13-3.6.10.5-properties-reflection
  section: 3.6.10.5
  title: Additional Requirements
  dimension: reflection
  subject: properties
  obligation: Make every property available as an attribute with the same name.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 12796
    evidence: '· Implementations of the TOSCA Simple Profile SHALL automatically reflect (i.e., make available)
      any property defined on an entity as an attribute of the entity with the same name as the property.

      · A property SHALL be considered required by default (i.e., as if the required keyname on the definition is
      set to true) unless the definition’s required keyname is explicitly set to false.

      · The value provided on a property definition’s default keyname SHALL be type compatible with the type declared
      on the definition’s type keyname.

      · Constraints of a property definition SHALL be type-compatible with the type defined for that definition.

      · If a ‘schema’ keyname is provided, its value (string) MUST represent a valid schema definition that matches
      the recognized external type provided as the value for the ‘type’ keyname as described by its correspondig
      schema specification.

      · TOSCA Orchestrators MAY choose to validate the value of the ‘schema’ keyname in accordance with the corresponding
      schema specifcation for any recognized external types.'
  expected_phase: normalization
