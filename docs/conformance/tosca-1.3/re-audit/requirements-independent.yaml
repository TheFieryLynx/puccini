- id: RA13-3.2-namespace-qualification
  section: '3.2'
  title: Using Namespaces
  dimension: qualification
  subject: namespace
  obligation: Form qualified imported type identity from its defining namespace and local name.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 7137
    evidence: 'As of TOSCA version 1.2, Service template authors may declare a namespace within a Service Template
      that would be used as the default namespace for any types (e.g., Node Type, Relationship Type, Data Type,
      etc.) defined within the same Service template.


      Specifically, a Service Template’s namespace declaration’s URI would be used to form a unique, fully qualified
      Type name when combined with the locally defined, unqualified name of any Type in the same Service Template.
      The resulatant, fully qualified Type name would be used by TOSCA Orchestrators, Processors and tooling when
      that Service Template was imported into another Service Template to avoid Type name collision.


      If a default namespace for the Service Template is declared, then it should be declared immediately after
      the “tosca_definitions_version” declaration, to ensure that the namespace is clearly visible.

      '
  expected_phase: namespace
- id: RA13-3.3.1-primitive-types-aliases
  section: 3.3.1
  title: Referenced YAML Types
  dimension: aliases
  subject: primitive-types
  obligation: Recognize the listed primitive type aliases and corresponding YAML types.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 7748
    evidence: 'Many of the types we use in this profile are built-in types from the YAML 1.2 specification (i.e.,
      those identified by the “tag:yaml.org,2002” version tag) [YAML-1.2].

      The following table declares the valid YAML type URIs and aliases that SHALL be used when possible when defining
      parameters or properties within TOSCA Service Templates using this specification:

      Valid aliases

      Type URI

      string

      tag:yaml.org,2002:str (default)

      integer

      tag:yaml.org,2002:int

      float

      tag:yaml.org,2002:float

      boolean

      tag:yaml.org,2002:bool (i.e., a value either ‘true’ or ‘false’)

      timestamp

      tag:yaml.org,2002:timestamp [YAML-TS-1.1]

      null

      tag:yaml.org,2002:null'
  expected_phase: read
