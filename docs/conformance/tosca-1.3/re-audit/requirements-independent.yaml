- id: RA13-3.3.2.2-numeric-version-comparison
  section: 3.3.2.2
  title: Version Comparison
  dimension: comparison
  subject: numeric-version
  obligation: Compare major, minor, fix components from left to right.
  strength: implicit-mandatory
  target:
    processor: true
    service_template_author: true
    orchestrator: false
    generator: false
    archive: false
  source:
    html_line: 7944
    evidence: '· When comparing TOSCA versions, all component versions (i.e., major, minor and fix) are compared
      in sequence from left to right.

      · TOSCA versions that include the optional qualifier are considered older than those without a qualifier.

      · TOSCA versions with the same major, minor, and fix versions and have the same qualifier string, but with
      different build versions can be compared based upon the build version.

      · Qualifier strings are considered domain-specific. Therefore, this specification makes no recommendation
      on how to compare TOSCA versions with the same major, minor and fix versions, but with different qualifiers
      strings and simply considers them different named branches derived from the same code.'
  expected_phase: rendering
