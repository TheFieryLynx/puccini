  source:
    html_line: 8564
    evidence: '· Whitespace: any number of spaces (including zero or none) SHALL be allowed between the scalar value
      and the unit value.

      · It SHALL be considered an error if either the scalar or unit portion is missing on a property or attribute
      declaration derived from any scalar-unit type.

      · When performing constraint clause evaluation on values of the scalar-unit type, both the scalar value portion
      and unit value portion SHALL be compared together (i.e., both are treated as a single value). For example,
      if we have a property called storage_size. which is of type scalar-unit, a valid range constraint would appear
      as follows:

      o storage_size: in_range [ 4 GB, 20 GB ]

      where storage_size’s range would be evaluated using both the numeric and unit values (combined together),
      in this case ‘4 GB’ and ’20 GB’.'
