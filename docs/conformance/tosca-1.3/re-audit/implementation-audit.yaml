method: Re-extracted live grammar registrations and located concrete function declarations; no reuse of old implementation
  symbol annotations. Detailed counterexample traces are in findings.yaml.
version_coupling:
  shared_v2_reader_registrations: 35
  all_reader_registrations: 69
  observation: TOSCA 1.3 directly uses v2_0 reader/model functions and function scriptlets; this is real code dependency.
    Shared code alone is not proof of semantic cross-version leakage.
  confirmed_leak: Property refinement is delegated to the shared PropertyDefinition reader, which has no value field
    for the 1.3 refinement grammar.
