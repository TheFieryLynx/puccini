probe_source: "package main\nimport (\n \"context\"\n \"encoding/json\"\n \"fmt\"\n \"os\"\n \"path/filepath\"\n\
  \ \"github.com/tliron/exturl\"\n \"github.com/tliron/go-puccini/tosca/parser\"\n \"github.com/tliron/go-puccini/normal\"\
  \n)\nfunc main(){for _,arg:=range os.Args[1:]{run(arg)}}\nfunc run(arg string){\n result:=map[string]any{\"file\"\
  :arg};defer func(){if p:=recover();p!=nil{result[\"panic\"]=fmt.Sprint(p)};json.NewEncoder(os.Stdout).Encode(result)}()\n\
  \ u:=exturl.NewContext();defer u.Release();p:=parser.NewParser().NewContext();a,_:=filepath.Abs(arg);p.URL=u.NewFileURL(filepath.ToSlash(a))\n\
  \ st,err:=p.Parse(context.Background());result[\"accepted\"]=err==nil;if err!=nil{result[\"error\"]=err.Error()};if\
  \ p.Root!=nil{result[\"diagnostics\"]=p.GetProblems().ToString(false)}\n if st!=nil{nodes:=map[string]any{};for\
  \ n,v:=range st.NodeTemplates{props:=map[string]any{};for k,x:=range v.Properties{if v,ok:=x.(*normal.Primitive);ok{props[k]=v.Primitive}else{props[k]=fmt.Sprintf(\"\
  %T\",x)}};nodes[n]=map[string]any{\"properties\":props}};result[\"nodes\"]=nodes}\n}\n"
