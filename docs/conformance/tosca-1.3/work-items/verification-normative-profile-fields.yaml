direct_evidence:
  test: tests/conformance/tosca_1_3/verification_normative_profile_fields_test.go#TestVerificationNormativeProfileFields
  positive:
    - each subtest locates the named field in the effective profile entity and asserts its data type
    - WebServer exports data_endpoint as Endpoint and admin_endpoint as Endpoint.Admin
  negative:
    - every required property rejects a derived-type attempt to refine required true to false
  diagnostic:
    - requiredness rejection identifies the exact property path and cannot-refine reason

