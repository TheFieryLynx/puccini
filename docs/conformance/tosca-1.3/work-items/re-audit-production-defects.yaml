- finding_id: F07
  specification:
    version: TOSCA Simple Profile in YAML 1.3
    sections:
    - section: 3.1.2
      title: TOSCA Namespacing in TOSCA Service Templates
    - section: 5.9.12.1
      title: Definition
    exact_rule: The automatically imported Container.Runtime host capability has type tosca.capabilities.Compute.
    source_excerpts:
    - &id002
      section: 3.1.2
      title: TOSCA Namespacing in TOSCA Service Templates
      text: 'In the TOSCA Simple Profile, TOSCA Service Templates MUST always have, as the first line of YAML, the
        keyword “ tosca_definitions_version ” with an associated TOSCA Namespace Alias value. This single line accomplishes
        the following: 1. Establishes the TOSCA Simple Profile Specification version whose grammar MUST be used
        to parse and interpret the contents for the remainder of the TOSCA Service Template. 2. Establishes the
        default TOSCA Namespace URI and Namespace Prefix for all types found in the document that are not explicitly
        namespaced. 3. Automatically imports (without the use of an explicit import statement) the normative type
        definitions (e.g., Node, Relationship, Capability, Artifact, etc.) that are associated with the TOSCA Simple
        Profile Specification the TOSCA Namespace Alias value identifies. 4. Associates the TOSCA Namespace URI
        and Namespace Prefix to the automatically imported TOSCA type definitions.'
    - section: 5.9.12.1
      title: Definition
      text: 'tosca.nodes.Container. Runtime: derived_from: tosca.nodes.SoftwareComponent capabilities: host: type:
        tosca.capabilities.Compute valid_source_types: [ tosca.nodes.Container.Application ] scalable: type: tosca.capabilities.Scalable'
    classification: required conditional grammar/semantics; normative profile availability
  existing_catalog:
