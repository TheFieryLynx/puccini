- finding_id: F16
  specification:
    version: TOSCA Simple Profile in YAML 1.3
    sections:
    - section: '5.2'
      title: TOSCA normative type names
    - section: 5.2.1
      title: Additional requirements
    - section: 5.4.4.3
      title: tosca.artifacts.Implementation.Bash
    - section: 5.4.4.4
      title: tosca.artifacts.Implementation.Python
    - section: 5.5.14
      title: tosca.capabilities.network.Bindable
    - section: 5.9.9
      title: tosca.nodes.Abstract.Storage
    - section: 5.9.10
      title: tosca.nodes.Storage.ObjectStorage
    - section: 5.9.11
      title: tosca.nodes.Storage.BlockStorage
    - section: 8.5.5
      title: tosca.relationships.network.BindsTo
    exact_rule: Declared shorthand and qualified names may replace the full Type URI and must retain the exact case
      declared in normative name tables.
    source_excerpts:
    - section: '5.2'
      title: TOSCA normative type names
      text: 'Every normative type has three names declared: 1. Type URI – This is the unique identifying name for
        the type. a. These are reserved names within the TOSCA namespace. 2. Shorthand Name – This is the shorter
        (simpler) name that can be used in place of its corresponding, full Type URI name. a. These are reserved
        names within TOSCA namespace that MAY be used in place of the full Type URI. b. Profiles of the OASIS TOSCA
        Simple Profile specifcaition SHALL assure non-collision of names for new types when they are introduced.
        c. TOSCA type designers SHOULD NOT create new types with names that would collide with any TOSCA normative
        type Shorthand Name. 3. Type Qualified Name – This is a modified Shorthand Name that includes the “ tosca
        : ” namespace prefix which clearly qualifies it as being part of the TOSCA namespace. a. This name MAY be
        used to assure there is no collision when types are imported from other (non) TOSCA approved sources.'
    - section: 5.2.1
      title: Additional requirements
      text: · Case sensitivity - TOSCA Type URI, Shorthand and Type Qualified names SHALL be treated as case sensitive.
        o The case of each type name has been carefully selected by the TOSCA working group and TOSCA orchestrators
        and processors SHALL strictly recognize the name casing as specified in this specification or any of its
        approved profiles.
    - section: 5.4.4.3
      title: tosca.artifacts.Implementation.Bash
      text: This artifact type represents a Bash script type that contains Bash commands that can be executed on
        the Unix Bash shell. Shorthand Name Bash Type Qualified Name tosca:Bash Type URI tosca.artifacts.Implementation.Bash
    - section: 5.4.4.4
      title: tosca.artifacts.Implementation.Python
      text: This artifact type represents a Python file that contains Python language constructs that can be executed
        within a Python interpreter. Shorthand Name Python Type Qualified Name tosca:Python Type URI tosca.artifacts.Implementation.Python
    - section: 5.5.14
      title: tosca.capabilities.network.Bindable
      text: A node type that includes the Bindable capability indicates that it can be bound to a logical network
        association via a network port. Shorthand Name network.Bindable Type Qualified Name tosca:network.Bindable
        Type URI tosca.capabilities.network.Bindable
    - section: 5.9.9
      title: tosca.nodes.Abstract.Storage
      text: The TOSCA Abstract.Storage node represents an abstract storage resource without any requirements on
        compute or network resources. Shorthand Name AbstractStorage Type Qualified Name tosca:Abstract.Storage
        Type URI tosca.nodes.Abstract.Storage
    - section: 5.9.10
