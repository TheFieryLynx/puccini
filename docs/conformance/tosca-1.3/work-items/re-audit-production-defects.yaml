- finding_id: F09
  specification:
    version: TOSCA Simple Profile in YAML 1.3
    sections:
    - section: 3.3.3.1
      title: Grammar
    - section: 3.3.3.2
      title: Keywords
    - section: 3.7.3.1
      title: Keynames
    - section: 3.8.2.1
      title: Keynames
    - section: 3.8.2.2.2
      title: 'Extended notation:'
    - section: 3.8.2.3
      title: 'min_occurrences, max_occurrences: lower and upper bounds of the range that further refines the minimum
        and maximum occurrences for this requirement specified in the corresponding requirement definition. The
        range specified here must fall completely within the occurrences range specified in the corresponding requirement
        definitionExamples'
    exact_rule: An assignment occurrence range must fall completely within its corresponding definition range; omission
      uses the definition range. Retain both effective bounds when normalizing.
    source_excerpts:
    - &id003
      section: 3.3.3.1
      title: Grammar
      text: 'TOSCA range values have the following grammar: [<lower_bound>, <upper_bound>] In the above grammar,
        the pseudo values that appear in angle brackets have the following meaning: · lower_bound : is a required
        integer value that denotes the lower boundary of the range. · upper_bound : is a required integer value
        that denotes the upper boundary of the range. This value MUST be greater than or equal to lower_bound .'
    - &id004
      section: 3.3.3.2
      title: Keywords
      text: 'The following Keywords may be used in the TOSCA range type: Keyword Applicable Types Description UNBOUNDED
        scalar Used to represent an unbounded upper bounds (positive) value in a set for a scalar type.'
    - section: 3.7.3.1
      title: Keynames
      text: 'The following is the list of recognized keynames for a TOSCA requirement definition: Keyname Required
        Type Constraints Description capability yes string N/A The required reserved keyname used that can be used
        to provide the name of a valid Capability Type that can fulfill the requirement. node no string N/A The
        optional reserved keyname used to provide the name of a valid Node Type that contains the capability definition
        that can be used to fulfill the requirement. relationship no string N/A The optional reserved keyname used
        to provide the name of a valid Relationship Type to construct when fulfilling the requirement. occurrences
        no range of integer implied default of [1,1] The optional minimum and maximum occurrences for the requirement.
        Note: the keyword UNBOUNDED is also supported to represent any positive integer.'
    - section: 3.8.2.1
      title: Keynames
      text: 'The following is the list of recognized keynames for a TOSCA requirement assignment: Keyname Required
        Type Description capability no string The optional reserved keyname used to provide the name of either a:
        · Capability definition within a target node template that can fulfill the requirement. · Capability Type
        that the provider will use to select a type-compatible target node template to fulfill the requirement at
        runtime. node no string The optional reserved keyname used to identify the target node of a relationship.
        specifically, it is used to provide either a: · Node Template name that can fulfill the target node requirement.
        · Node Type name that the provider will use to select a type-compatible node template to fulfill the requirement
        at runtime. relationship no string The optional reserved keyname used to provide the name of either a: ·
        Relationship Template to use to relate the source node to the (capability in the) target node when fulfilling
        the requirement. · Relationship Type that the provider will use to select a type-compatible relationship
        template to relate the source node to the target node at runtime. node_filter no node filter The optional
        filter definition that TOSCA orchestrators or providers would use to select a type-compatible target node
        that can fulfill the associated abstract requirement at runtime. occurrences no range of integer An optional
        range that further refines the optional minimum and maximum occurrences for this requirement. If no range
        is specified, the range from the corresponding requirement definition is used. The following is the list
        of recognized keynames for a TOSCA requirement assignment’s relationship keyname which is used when property
        assignments or inputs of declared interfaces (or their operations) need to be provided: Keyname Required
        Type Description type no string The optional reserved keyname used to provide the name of the Relationship
        Type for the requirement assignment’s relationship keyname. properties no map of property assignments An
        optional map of property assignments for the relationship. interfaces no map of interface definitions The
        optional reserved keyname used to reference declared (named) interface definitions of the corresponding
        Relationship Type in order to provide Property assignments for these interfaces or operations of these interfaces.'
    - section: 3.8.2.2.2
      title: 'Extended notation:'
      text: 'The following grammar would be used if the requirement assignment needs to provide more information
        than just the Node Template name: < requirement_name >: node: < node_template_name > | < node_type_name
        > relationship: < relationship_template_name > | < relationship_type_name > capability: < capability_symbolic_name
        > | < capability_type_name > node_filter: < node_filter_definition > occurrences: [ min_occurrences , max_occurrences
        ]'
    - section: 3.8.2.3
      title: 'min_occurrences, max_occurrences: lower and upper bounds of the range that further refines the minimum
        and maximum occurrences for this requirement specified in the corresponding requirement definition. The
        range specified here must fall completely within the occurrences range specified in the corresponding requirement
        definitionExamples'
      text: ''
    classification: required conditional grammar/semantics; normative profile availability
