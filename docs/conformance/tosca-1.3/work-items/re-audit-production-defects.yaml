- finding_id: F06
  specification:
    version: TOSCA Simple Profile in YAML 1.3
    sections:
    - section: 3.5.1
      title: Required Keynames
    - section: 3.6.7.1
      title: Keynames
    - section: 3.6.7.2.1
      title: Short notation
    - section: 3.6.7.2.2
      title: 'Extended notation:'
    exact_rule: checksum_algorithm shall be specified if checksum is specified; required keynames can be inherited
      where an effective artifact definition refines its parent.
    source_excerpts:
    - section: 3.5.1
      title: Required Keynames
      text: The TOSCA metamodel includes complex types (e.g., Node Types, Relationship Types, Capability Types,
        Data Types, etc.) each of which include their own list of reserved keynames that are sometimes marked as
        required . These types may be used to derive other types. These derived types (e.g., child types) do not
        have to provide required keynames as long as they have been specified in the type they have been derived
        from (i.e., their parent type).
    - section: 3.6.7.1
      title: Keynames
      text: 'The following is the list of recognized keynames for a TOSCA artifact definition when using the extended
        notation: Keyname Required Type Description type yes string The required artifact type for the artifact
        definition. file yes string The required URI string (relative or absolute) which can be used to locate the
        artifact’s file. repository no string The optional name of the repository definition which contains the
        location of the external repository that contains the artifact. The artifact is expected to be referenceable
        by its file URI within the repository. description no description The optional description for the artifact
        definition. deploy_path no string The file path the associated file would be deployed into within the target
        node’s container. artifact_version no string The version of this artifact. One use of this artifact_version
        is to declare the particular version of this artifact type, in addition to its mime_type (that is declared
        in the artifact type definition). Together with the mime_type it may be used to select a particular artifact
        processor for this artifact. For example a python interpreter that can interpret python version 2.7.0 checksum
        no string The checksum used to validate the integrity of the artifact. checksum_algorithm no string Algorithm
        used to calculate the artifact checksum (e.g. MD5, SHA [Ref] ). Shall be specified if checksum is specified
        for an artifact. properties no map of property assignments The optional map of property assignments associated
        with the artifact.'
    - section: 3.6.7.2.1
      title: Short notation
      text: 'The following single-line grammar may be used when the artifact’s type and mime type can be inferred
        from the file URI: < artifact_name >: < artifact_file_URI >'
    - section: 3.6.7.2.2
      title: 'Extended notation:'
      text: 'The following multi-line grammar may be used when the artifact’s definition’s type and mime type need
        to be explicitly declared: < artifact_name >: description: < artifact_description > type: < artifact_type_name
        > file: < artifact_file_URI > repository: < artifact_repository_name > deploy_path: < file_deployment_path
        > version: <artifact _version> checksum: <artifact_checksum> checksum_algorithm: <artifact_checksum_algorithm>
        properties: <property assignments> In the above grammars, the pseudo values that appear in angle brackets
        have the following meaning: · artifact_name : represents the required symbolic name of the artifact as a
        string . · artifact_description : represents the optional description for the artifact. · artifact_type_name
        : represents the required artifact type the artifact definition is based upon. · artifact_file_URI : represents
        the required URI string (relative or absolute) which can be used to locate the artifact’s file. · artifact_repository_name
        : represents the optional name of the repository definition to use to retrieve the associated artifact (file)
        from. · file_deployement_path : represents the optional path the artifact_file_URI would be copied into
        within the target node’s container. · artifact_version : represents the version of artifact · artifact_checksum:
        represents the checksum of the Artifact · artifact_checksum_algorithm: represents the algorithm for verifying
        the checksum. Shall be specified if checksum is specified · properties : represents an optional map of property
        assignments associated with the artifact'
    classification: required conditional grammar/semantics; normative profile availability
  existing_catalog:
