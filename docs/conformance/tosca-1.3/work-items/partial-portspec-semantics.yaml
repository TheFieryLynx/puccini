group_implementation:
  interpretation:
    type_scope: >-
      The rules apply to the normative PortSpec data type and types derived
      from it, not to unrelated structural lookalikes.
    range_bounds: >-
      "Within the numeric range" is inclusive at both bounds, consistently
      with the normative range data type and in_range constraint.
    collection_entries: >-
      Endpoint.ports declares PortSpec through a map entry_schema, so the
      completed entry value must reach the same validator as a direct property.
    functions: >-
      A function call is preserved and deferred by the existing data-value
      validator until it has a concrete result; it is not mistaken for a
      malformed final PortSpec.
  version_isolation: >-
    Only the TOSCA 1.3 grammar installs DataValueValidator. Shared rendering
    exposes completed collection entries to that optional hook; TOSCA 2.0
    leaves it unset.
  baseline_reproduction:
    performed: true
    observed_failures:
      - "PortSpec values with none of the four required selector properties were accepted."
      - "source_range and target_range were accepted without their corresponding port."
      - "Ports below and above their corresponding ranges were accepted."
      - "A type derived from PortSpec bypassed all three rules."
      - "PortSpec values reached through map entry_schema bypassed data-value validation."
      - "The normative in_range constraint on a range-valued property attempted to render integer bounds as range values."
    correct_failure_reason_verified: true
  mutation_check:
    performed: true
    mutation: "Temporarily disabled only the TOSCA 1.3 validatePortSpec call."
    affected_tests:
      - TestPartialPortSpecRejectsNoPortFields
      - TestPartialPortSpecRejectsInvalidSourceRangePair
      - TestPartialPortSpecRejectsInvalidTargetRangePair
      - TestPartialPortSpecRulesFollowTypeIdentity
      - TestPartialPortSpecNestedMapEntryValidated
    expected_tests_failed: true
    production_diff_restored: true
  results:
    TOSCA13-5.3.11.3-001:
      implementation_status: implemented
      verification_status: verified
    TOSCA13-5.3.11.3-002:
      implementation_status: implemented
      verification_status: verified
    TOSCA13-5.3.11.3-003:
      implementation_status: implemented
      verification_status: verified

