specification:
  version: "TOSCA Simple Profile in YAML 1.3"
  source: docs/specifications/tosca/1.3/TOSCA-Simple-Profile-YAML-v1.3-os.html
  frozen_atomic_must_denominator: 223
scope:
  requirement_count: 34
  sections: ["3.1", "3.1.1", "3.1.2", "3.1.3.1", "3.6.8.1", "3.6.8.2.2", "3.6.8.2.3"]

templates:
  final_status: &final_status
    final_implementation_status: implemented
    final_verification_status: verified
    final_gaps: []
    mutation_check:
      performed: true
      expected_test_failed: true
  namespace_symbols: &namespace_symbols
    - grammars.DetectGrammar
    - tosca_v1_3.ReadServiceFile
    - tosca_v1_3.ServiceFile.ValidateNamespace
    - tosca_v1_3.validateImportedDefinitionIdentities
    - parser.Context.AddNamespaces
    - parser.Context.LookupNames
    - parsing.Namespace.Merge
    - parsing.Namespace.LookupForType
  import_symbols: &import_symbols
    - tosca_v1_3.ReadImport
    - tosca_v2_0.Import.NewImportSpec
    - parser.Context.goReadImports
    - parser.Context.AddNamespaces
    - parser.Context.LookupNames
  collision_symbols: &collision_symbols
    - parsing.Context.ReadFields
    - parsing.Context.setMapItem
    - parsing.Context.appendUnique
    - parsing.Context.ReportDuplicateMapKey
  namespace_tests: &namespace_tests
    positive: [TestNamespaceDeclarations]
    negative: [TestDefinitionsVersionFirstLine, TestReservedNamespacePolicy]
    collision: [TestNamespacePrefixCollisions, TestDuplicateNamespaceDeclaration, TestLocalNameCollisions]
    resolution: [TestQualifiedImportedTypeResolution]
    import_graph: [TestImportGraphResolution]
  import_tests: &import_tests
    positive: [TestImportNotationAndResolution]
    negative: [TestImportGrammarErrors, TestImportResolutionErrors]
    collision: [TestDuplicateImportIsIdempotent, TestConflictingImportedDefinitionIdentity, TestImportCollisionDeterminism]
    resolution: [TestQualifiedImportedTypeResolution, TestImportDifferentDefinitionsVersionIsRejected]
    import_graph: [TestImportGraphResolution]
  collision_tests: &collision_tests
    positive: []
    negative: [TestLocalNameCollisions]
    collision: [TestLocalNameCollisions]
    resolution: [TestImportCollisionDeterminism]
    import_graph: []

