      affected_tests:
        - TestVerificationOverrideWorkflowOccurrences/TOSCA13-3.6.17.3-002
      expected_tests_failed: true
    - description: replaced a template implementation with its effective type implementation
      affected_tests:
        - TestVerificationOverrideWorkflowOccurrences/TOSCA13-5.8.1-004
      expected_tests_failed: true
    - description: read the explicit and operator as or while retaining its children
      affected_tests:
