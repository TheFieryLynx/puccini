direct_evidence:
  test: tests/conformance/tosca_1_3/verification_override_workflow_occurrences_test.go#TestVerificationOverrideWorkflowOccurrences
  positive:
    - the normalized subtype node uses scripts/subtype.sh instead of scripts/parent.sh
    - the normalized template node uses scripts/template.sh instead of its effective subtype script
    - the explicit and clause retains both state assertions under the conjunction operator
  boundary:
    - a requirement without occurrences renders to the exact closed range [1,1]
  diagnostic: []

baseline_reproduction:
  performed: true
  result: all direct tests passed; no implementation defect was discovered

