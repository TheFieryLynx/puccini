  - requirement_id: TOSCA13-3.6.25.2.1-002
    normative_rule: an and clause is true only through the conjunction of all its condition clauses
    initial_status: implemented/untested
    final_status: implemented/verified
  - requirement_id: TOSCA13-3.7.3.3-002
