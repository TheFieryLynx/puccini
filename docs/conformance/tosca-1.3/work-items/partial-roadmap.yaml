    section_title: "Additional Requirements"
    normative_rule: "A zero version value denotes that no version was provided."
    current_implementation_status: partial
    current_verification_status: untested
    implemented_parts:
      - "Version lexical parsing recognizes major, minor, fix, qualifier and build components."
      - "The values 0.0 and 0.0.0 are lexically accepted."
    missing_parts:
      - "The effective value does not distinguish the normative unspecified-version sentinel from an ordinary supplied version."
      - "No direct test proves equivalent zero spellings."
    implementation:
      packages: [tosca/grammars/tosca_v1_3, tosca/grammars/tosca_v2_0]
      files: [tosca/grammars/tosca_v1_3/version.go, tosca/grammars/tosca_v1_3/common.go, tosca/grammars/tosca_v2_0/version.go]
      symbols: [tosca_v1_3.ReadVersion, tosca_v2_0.Version]
      parser_phase: rendering
      execution_path: [parser.Context.Parse, tosca_v1_3.ReadValue, tosca_v1_3.ReadVersion]
    remediation_group: version-zero-semantics
    remediation_order: 1
    dependencies: []
    risk: medium
    planned_tests:
      positive: [TestVersionZeroMeansUnspecified]
      negative: []
      boundary: [TestVersionZeroSpellingsAreEquivalent]
      inheritance: []
      resolution: []
      normalization: [TestVersionZeroNormalizesAsUnspecified]
      regression: [TestTosca20VersionZeroBehaviorUnchanged]

