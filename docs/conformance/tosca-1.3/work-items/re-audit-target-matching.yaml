    8: no-match
    9: explicit-incompatible-no-fallback; wrong-name-type
    10: missing-name; case-sensitive
    11: sibling-not-derived
    12: Relationship valid_target_types constrains capability types, tested by relationship-targets; capability valid_source_types is tested separately.
    13: wrong-node-type
    14: relationship-targets; relationship-actual-derived; relationship-template
    15: exact
    16: multiple-deferred (decision 0015; no normative uniqueness or first-match rule)
    17: no-match; incompatible-without-relationship
    18: Concrete node_filter invalid by 3.8.2.2.3 even when size equals 4.
    19: Concrete node_filter invalid by 3.8.2.2.3 when size differs from 9.
    20: Concrete capability filter invalid by 3.8.2.2.3 regardless of property values.
    21: inherited-value-still-invalid; abstract predicates retained for runtime matching.
    22: filter-and-type-invalid; abstract-preserves-conjunction
    23: TestReAuditTargetMatchingInheritance/Derived
    24: TestReAuditTargetMatchingInheritance/Sibling rejects at inheritance
    25: requirement-narrowing; requirement-widening
    26: multilevel; inherited requirement on SourceChild
    27: TestReAuditTargetMatchingOccurrences within-range
    28: occurrence interval outside definition rejected at inheritance; excess assignment count rejected at rendering
    29: Omitted assignment remains a required abstract obligation, not an error; consistent with existing semantics and runtime fulfillment.
    30: All targetRequirement assertions retain [1,2]; complete earlier F09 suite also rerun.
    31: All positive targetRequirement assertions verify node target.
    32: Unique and named matches assert CapabilityName; multi-match remains unbound.
    33: TestReAuditTargetMatchingDeterminism alternates node declaration order.
    34: TestReAuditTargetMatchingDeterminism normalizes each context twice.
