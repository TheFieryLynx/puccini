group_implementation:
  interpretation:
    explicit_endpoint_assignment: >-
      "Provided" is evaluated on a source capability assignment. The shared
      renderer materializes omitted capability definitions for normalization;
      that internal object is not treated as an explicit empty YAML value.
      An explicit empty assignment is a value and is rejected.
    effective_values: >-
      Capability type inheritance and node-type capability refinement complete
      definitions before assignments render. Scalable comparison therefore
      uses explicit values over effective inherited/refined defaults.
    inclusive_range: >-
      "Between" is interpreted inclusively, consistent with the specification's
      range semantics and boundary wording.
    functions: >-
      Endpoint validates function-valued port by presence. Scalable comparison
      is deferred while any compared value remains an intrinsic function.
  version_isolation: >-
    Shared capability rendering exposes an optional neutral hook. Only TOSCA
    1.3 installs the normative profile policy; TOSCA 2.0 leaves it nil.
  baseline_reproduction:
    performed: true
    observed_failures:
      - "An explicit empty Endpoint assignment was accepted."
      - "An Endpoint assignment containing protocol but neither port nor ports was accepted."
      - "A capability type derived from Endpoint bypassed the rule."
      - "Scalable default_instances below min_instances or above max_instances was accepted."
      - "Normative min/max defaults were not compared with default_instances."
      - "Refined inherited Scalable defaults were not compared."
    correct_failure_reason_verified: true
  mutation_check:
    performed: true
    mutation: "Temporarily removed only the TOSCA 1.3 capability-assignment validator registration."
    affected_tests:
      - TestPartialEndpointWithoutPortOrPortsRejected
      - TestPartialEndpointRuleFollowsCapabilityTypeIdentity
      - TestPartialScalableDefaultInstancesOutsideRangeRejected
      - TestPartialScalableUsesInheritedRefinedDefaults
    expected_tests_failed: true
    production_diff_restored: true
  results:
    TOSCA13-5.5.7.4-001:
      implementation_status: implemented
      verification_status: verified
    TOSCA13-5.5.13.1-012:
      implementation_status: implemented
      verification_status: verified

