requirements:
  - requirement_id: TOSCA13-6.1-004
    section: "6.1"
    section_title: "Overall Structure of a CSAR"
    normative_rule: "A root YAML entry used when TOSCA-Metadata is absent MUST define a metadata section."
    current_behavior: "A metadata-less CSAR with one root TOSCA 1.3 YAML file is accepted when that file has no metadata section."
    expected_behavior: "Reject the archive during the read phase and identify the missing root metadata section."
    minimal_reproducer: "A .csar ZIP containing only service.yaml with tosca_definitions_version: tosca_simple_yaml_1_3."
    current_verification_status: verified
    implementation_status: implemented
    verification_status: verified

    implementation:
      packages:
        - tosca/csar
        - tosca/parser
        - tosca/parsing
        - tosca/grammars/tosca_v1_3
      files:
        - tosca/csar/url.go
        - tosca/parser/phase1-read.go
        - tosca/parsing/context.go
        - tosca/grammars/tosca_v1_3/service-file.go
      symbols:
        - csar.ResolveServiceTemplateURL
        - parser.Context.read
        - parsing.CSARContext
        - tosca_v1_3.validateCSAR
      parser_phase: csar/read
      execution_path:
        - parser.Context.ReadRoot
        - csar.ResolveServiceTemplateURL
        - grammars.DetectGrammar
        - tosca_v1_3.ReadServiceFile
        - tosca_v1_3.validateCSAR

    remediation_group: csar-read-validation
    remediation_order: 1
    planned_tests:
      positive:
        - TestCSARWithoutMetadataAcceptsRequiredRootMetadata
      negative:
        - TestCSARWithoutMetadataRequiresRootMetadata
      boundary:
        - TestCSARWithoutMetadataRejectsMultipleRootDefinitions
      regression:
        - TestCSARValidationDoesNotChangeTosca20

  - requirement_id: TOSCA13-6.1-006
    section: "6.1"
    section_title: "Overall Structure of a CSAR"
    normative_rule: "The required root metadata section in an archive without TOSCA-Metadata requires template_name."
    current_behavior: "The root TOSCA 1.3 YAML file is accepted when metadata omits template_name."
    expected_behavior: "Reject the archive during the read phase and identify metadata.template_name."
    minimal_reproducer: "A metadata-less .csar whose sole root service.yaml contains metadata.template_version but no template_name."
    current_verification_status: verified
    implementation_status: implemented
    verification_status: verified

    implementation:
      packages:
        - tosca/csar
        - tosca/parser
        - tosca/parsing
        - tosca/grammars/tosca_v1_3
      files:
        - tosca/csar/url.go
        - tosca/parser/phase1-read.go
        - tosca/parsing/context.go
        - tosca/grammars/tosca_v1_3/service-file.go
      symbols:
        - csar.ResolveServiceTemplateURL
        - parser.Context.read
        - parsing.CSARContext
        - tosca_v1_3.validateCSAR
      parser_phase: csar/read
      execution_path:
        - parser.Context.ReadRoot
        - csar.ResolveServiceTemplateURL
        - grammars.DetectGrammar
        - tosca_v1_3.ReadServiceFile
        - tosca_v1_3.validateCSAR

    remediation_group: csar-read-validation
    remediation_order: 1
    planned_tests:
      positive:
        - TestCSARWithoutMetadataAcceptsRequiredRootMetadata
      negative:
        - TestCSARWithoutMetadataRequiresRootMetadata
      boundary:
        - TestCSARWithoutMetadataReportsMissingNamesDeterministically
      regression:
        - TestOrdinaryServiceTemplateMetadataRemainsOptional

