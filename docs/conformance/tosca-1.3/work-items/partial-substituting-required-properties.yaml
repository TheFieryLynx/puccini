requirements:
  - requirement_id: TOSCA13-3.8.8.3-005
    section: "3.8.8.3"
    section_title: "Notes"
    normative_rule: >-
      If the substituting template is valid, all required properties of all
      its node templates have valid property assignments already defined.
    current_implementation_status: partial
    current_verification_status: untested
    implemented_parts:
      - "Every node template participates in parser rendering."
      - "Effective inherited property definitions are supplied to RenderProperties."
      - "An explicit value is rendered against its effective data type and constraints."
      - "A property default supplies an absent assignment."
      - "An absent property whose effective required value is true is diagnosed."
    missing_parts:
      - "No direct conformance test proved that the generic path covers substituting templates."
      - "No direct test covered every disconnected internal node."
      - "No direct test covered inherited required properties, defaults, optional properties, or function-valued assignments together with substitution_mappings."
      - "No mutation evidence proved sensitivity to the required-property branch."
    implementation:
      packages:
        - tosca/grammars/tosca_v2_0
        - tosca/parser
      files:
        - tosca/grammars/tosca_v2_0/node-template.go
        - tosca/grammars/tosca_v2_0/value.go
        - tosca/grammars/tosca_v2_0/property-definition.go
