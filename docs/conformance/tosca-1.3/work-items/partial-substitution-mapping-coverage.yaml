group_implementation:
  interpretation:
    effective_type: >-
      "Defined in the specified node_type" is interpreted as the effective
      inherited definition set used by every other type-dependent semantic
      operation, not only declarations lexically present on the derived type.
    cardinality: >-
      At least one mapping is required for each requirement definition. This
      completeness rule does not independently require a mapping for every
      allowed occurrence; existing occurrence/count validation remains
      separate.
    optionality: >-
      The word every is not conditional on property requiredness or requirement
      lower bounds, so optional definitions also require mappings.
    excluded_kinds: >-
      Attributes and interfaces are not included in this MUST sentence and are
      not made mandatory by the implementation.
  version_isolation: >-
    Shared rendering exposes an optional neutral completion hook. Only TOSCA
    1.3 installs it; TOSCA 2.0 observable behavior remains unchanged.
  baseline_reproduction:
    performed: true
    observed_failures:
      - "Missing local and inherited property mappings were accepted."
      - "Missing local and inherited capability mappings were accepted."
      - "Missing local and inherited requirement mappings were accepted."
      - "Optional definitions could be omitted."
    correct_failure_reason_verified: true
  mutation_check:
    performed: true
    mutation: "Temporarily removed only the TOSCA 1.3 substitution-mappings validator registration."
    affected_tests:
      - TestPartialSubstitutionMappingRejectsMissingProperties
      - TestPartialSubstitutionMappingRejectsMissingCapabilities
      - TestPartialSubstitutionMappingRejectsMissingRequirements
      - TestPartialSubstitutionMappingCoverageDiagnosticIsDeterministic
    expected_tests_failed: true
    production_diff_restored: true
  results:
    TOSCA13-3.8.13.4-001:
      implementation_status: implemented
      verification_status: verified

