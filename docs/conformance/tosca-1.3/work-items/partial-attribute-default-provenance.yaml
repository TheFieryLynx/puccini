remediation_group: attribute-default-provenance
remediation_order: 11
normative_source: docs/specifications/tosca/1.3/TOSCA-Simple-Profile-YAML-v1.3-os.html
decision_record: docs/decisions/0010-tosca-1.3-attribute-default-provenance.md
parser_phase: rendering after inheritance and function parsing
execution_path:
  - parser.Context.ReadRoot
  - tosca_v1_3.ReadAttributeDefinition
  - parser.Context.LookupNames
  - parser.Context.Inherit
  - parser.Context.Render
  - tosca_v2_0.AttributeDefinition.Render
  - tosca_v2_0.ParseFunctionCalls
  - tosca_v1_3.validateAttributeDefaultProvenance
  - tosca_v1_3.analyzeAttributeDefaultProvenance

requirements:
  - requirement_id: TOSCA13-3.6.12.4-002
    section: "3.6.12.4"
    section_title: "Additional Requirements"
    normative_rule: >-
      Values for the default keyname MUST be derived or calculated from other
      attribute or operation output values that reflect actual instance state,
      and not be hard-coded or derived from property settings or inputs.
    current_implementation_status: partial
    current_verification_status: untested
    implemented_parts:
      - "Attribute defaults are parsed as Values and type-checked during rendering."
      - "Intrinsic functions are parsed recursively inside function arguments."
      - "Inherited attribute defaults are copied into effective definitions."
      - "Function-valued defaults survive normalization."
    missing_parts:
      - "Hard-coded attribute-definition defaults were accepted."
      - "Defaults derived through get_input were accepted."
      - "Defaults derived through get_property were accepted."
      - "Mixed calculations containing an actual-state and desired-state source were accepted."
      - "Structured defaults did not validate provenance for each nested leaf."
      - "No direct test distinguished actual-state and desired-state provenance."
    implementation:
      packages:
        - tosca/grammars/tosca_v1_3
        - tosca/grammars/tosca_v2_0
        - tosca/parsing
        - tosca/parser
      files:
        - tosca/grammars/tosca_v1_3/attribute-definition.go
        - tosca/grammars/tosca_v1_3/common.go
        - tosca/grammars/tosca_v2_0/attribute-definition.go
        - tosca/grammars/tosca_v2_0/functions.go
        - tosca/parsing/grammars.go
        - tosca/parser/phase4-inheritance.go
        - tosca/parser/phase5-rendering.go
      symbols:
        - parsing.Grammar.AttributeDefinitionValidator
        - tosca_v2_0.AttributeDefinition.Render
        - tosca_v1_3.validateAttributeDefaultProvenance
        - tosca_v1_3.analyzeAttributeDefaultProvenance
      version_isolation: >-
        Shared rendering exposes a neutral optional attribute-definition
        policy hook. Only TOSCA 1.3 installs the provenance validator; TOSCA
        2.0 leaves it unset.
    interpretation:
      actual_state_sources:
        - get_attribute
        - get_operation_output
      prohibited_desired_state_sources:
        - get_input
        - get_property
      calculated_values: >-
        A composition function is valid when at least one actual-state source
        contributes and no desired-state source contributes. Literal operands
        inside that calculation are allowed.
      structured_values: >-
        Every independent list or map leaf must satisfy the provenance rule;
        standalone literal leaves are hard-coded.
      inheritance: >-
        A default is validated at its declaring definition. Omitted inherited
        defaults do not emit duplicate diagnostics; explicit refinement
        defaults are validated locally.
      normative_profile_conflict: >-
        Sections 5.9.1 and 5.7.1 explicitly require literal initial defaults
        for Root state attributes. The pinned internal normative profile is
        narrowly exempt; user-authored copies are not.
    planned_tests:
      positive:
        - TestPartialAttributeDefaultProvenanceAcceptsActualStateSources
      negative:
        - TestPartialAttributeDefaultProvenanceRejectsForbiddenSources
        - TestPartialAttributeDefaultProvenanceRejectsHardCodedStructuredLeaf
      boundary:
        - TestPartialAttributeDefaultProvenanceDiagnosticIsDeterministic
        - TestPartialAttributeDefaultProvenancePreservesPinnedRootStateDefault
      inheritance:
        - TestPartialAttributeDefaultProvenanceInheritance
      resolution:
        - TestPartialAttributeDefaultProvenanceAcceptsActualStateSources
      normalization:
        - TestPartialAttributeDefaultProvenanceAcceptsActualStateSources
      regression:
        - TestPartialAttributeDefaultProvenanceDoesNotChangeTOSCA20
        - tests/conformance/tosca_1_3/property_attribute_reflection_test.go
    baseline_reproduction:
      performed: true
      observed_failures:
        - "Literal attribute defaults were accepted."
        - "get_input and get_property attribute defaults were accepted."
        - "Mixed actual-state/desired-state calculations were accepted."
      correct_failure_reason_verified: true
    mutation_check:
      performed: true
      mutation: "Temporarily removed only the TOSCA 1.3 attribute-definition validator registration."
      affected_tests:
        - TestPartialAttributeDefaultProvenanceRejectsForbiddenSources
        - TestPartialAttributeDefaultProvenanceRejectsHardCodedStructuredLeaf
        - TestPartialAttributeDefaultProvenanceInheritance
        - TestPartialAttributeDefaultProvenanceDiagnosticIsDeterministic
      expected_tests_failed: true
      production_diff_restored: true
    result:
      implementation_status: implemented
      verification_status: verified

