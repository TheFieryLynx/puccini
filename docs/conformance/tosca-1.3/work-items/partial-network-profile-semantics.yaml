group_implementation:
  interpretation:
    conditional_requiredness: >-
      The physical_network property's "required if" wording is enforced as
      conditional presence on the effective node-template value whenever the
      concrete network_type equals flat or vlan.
    effective_values: >-
      Explicit assignments override inherited/refined property defaults before
      the conditional is evaluated.
    other_values: >-
      The pinned text names only flat and vlan. Absent, gre, vxlan, and
      extension string values do not activate this particular condition.
    functions: >-
      A function-valued network_type is preserved and deferred until concrete;
      the parser does not guess that its runtime result is flat or vlan.
  version_isolation: >-
    Shared node rendering exposes an optional neutral hook. Only TOSCA 1.3
    installs this normative Network policy; TOSCA 2.0 leaves it nil.
  baseline_reproduction:
    performed: true
    observed_failures:
      - "network_type flat without physical_network was accepted."
      - "network_type vlan without physical_network was accepted."
      - "A type derived from Network with an effective flat default bypassed the condition."
    correct_failure_reason_verified: true
  mutation_check:
    performed: true
    mutation: "Temporarily removed only the TOSCA 1.3 node-template validator registration."
    affected_tests:
      - TestPartialFlatAndVlanNetworkRequirePhysicalNetwork
      - TestPartialDerivedNetworkRetainsConditionalRule
    expected_tests_failed: true
    production_diff_restored: true
  results:
    TOSCA13-8.5.1.1-036:
      implementation_status: implemented
      verification_status: verified

