mutations:
  - category: namespaces-imports
    production_validation_path: tosca_v1_3.ReadServiceFile -> validateNamespaceDeclarations
    mutation: removed only the TOSCA 1.3 namespace-declaration validator call
    affected_cases:
      - TOSCA13-CORPUS-NAMESPACE-RESERVED-INVALID
    expected_corpus_failures: true
    observed_result: invalid reserved namespace was accepted and the corpus runner failed
    production_diff_restored: true
  - category: data-types
    production_validation_path: tosca_v1_3.ReadScalarUnit
    mutation: suppressed only the malformed scalar-unit diagnostic for a missing scalar or unit component
    affected_cases:
      - TOSCA13-CORPUS-SCALAR-UNIT-MISSING-UNIT-INVALID
    expected_corpus_failures: true
    observed_result: incomplete scalar-unit value was accepted and the corpus runner failed
    production_diff_restored: true
  - category: grammar-definitions
    production_validation_path: tosca_v1_3.ReadPropertyDefinition -> required-key validation
    mutation: injected an implicit string type only when a property definition omitted its required type
    affected_cases:
      - TOSCA13-CORPUS-PROPERTY-MISSING-TYPE-INVALID
    expected_corpus_failures: true
    observed_result: the missing-type definition was accepted and the corpus runner failed
    production_diff_restored: true
  - category: type-definitions
    production_validation_path: parsing.GetHierarchy -> ReportInheritanceLoop
    mutation: suppressed only the structured inheritance-loop diagnostic while retaining bounded cycle termination
    affected_cases:
      - TOSCA13-CORPUS-TYPE-HIERARCHY-CYCLE-INVALID
    expected_corpus_failures: true
    observed_result: cycle termination remained bounded but the required loop diagnostic disappeared
    production_diff_restored: true
  - category: deterministic-type-hierarchy
    production_validation_path: parsing.NewHierarchyFor ordered entity traversal
    mutation: removed deterministic source-URL and structural-path ordering (the pre-remediation implementation)
    affected_cases:
      - TOSCA13-CORPUS-TYPE-HIERARCHY-CYCLE-INVALID
    expected_corpus_failures: true
    observed_result: count-20 execution alternated the loop diagnostic between First and Second
    production_diff_restored: true
  - category: template-definitions
    production_validation_path: tosca_v1_3.ReadNodeTemplate -> required type validation
    mutation: injected tosca.nodes.Root only for node templates missing the required type key
    affected_cases:
      - TOSCA13-CORPUS-NODE-TEMPLATE-MISSING-TYPE-INVALID
    expected_corpus_failures: true
    observed_result: the missing-type node template was accepted and the corpus runner failed
    production_diff_restored: true
  - category: intrinsic-functions
    production_validation_path: tosca_v1_3 intrinsic function argument validator -> token
    mutation: accepted the two-argument token form by suppressing only its missing substring_index diagnostic
    affected_cases:
      - TOSCA13-CORPUS-FUNCTION-ARGUMENTS-INVALID
    expected_corpus_failures: true
    observed_result: the incomplete token call was accepted and the corpus runner failed
    production_diff_restored: true
  - category: normative-profile
    production_validation_path: TOSCA 1.3 normative profile -> tosca.nodes.network.Port.order
    mutation: changed only the normative order property from required true to required false
    affected_cases:
      - TOSCA13-CORPUS-NETWORK-PORT-REFINEMENT-INVALID
    expected_corpus_failures: true
    observed_result: a derived Port made order optional and the corpus runner failed
    production_diff_restored: true
  - category: csar
    production_validation_path: csar.ValidateTOSCA13Meta -> Entry-Definitions root confinement
    mutation: bypassed only the ../ prefix rejection while retaining all other path checks
    affected_cases:
      - TOSCA13-CORPUS-CSAR-TRAVERSAL-INVALID
    expected_corpus_failures: true
    observed_result: the archive entry outside the logical CSAR root was selected and accepted
    production_diff_restored: true
  - category: workflows-interactions
    production_validation_path: WorkflowStepDefinition.TargetNodeTemplateOrGroupName mandatory read tag
    mutation: removed only the mandatory marker from the workflow step target field
    affected_cases:
      - TOSCA13-CORPUS-WORKFLOW-MISSING-TARGET-INVALID
    expected_corpus_failures: true
    observed_result: a workflow step without target was accepted and the corpus runner failed
    production_diff_restored: true
  - category: requirement-target-normalization
    production_validation_path: RequirementAssignment.Normalize target-node linkage after NodeTemplates.Normalize creates all normalized nodes
    mutation: disabled propagation of the resolved target node template into the normalized requirement
    affected_cases:
      - TOSCA13-CORPUS-INTERACTION-REQUIREMENTS-CAPABILITIES
      - TestVerificationConnectsToEndpointSemantics
    expected_corpus_failures: true
    observed_result: both the corpus assertion and the direct ConnectsTo test reported a nil target node
    production_diff_restored: true
