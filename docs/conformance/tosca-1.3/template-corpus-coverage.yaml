schema_version: 1
normative_source: docs/specifications/tosca/1.3/TOSCA-Simple-Profile-YAML-v1.3-os.html
completeness_model: normative-equivalence-classes

grammar_entities:
  - entity: namespace-declaration
    sections: ["3.1", "3.1.1", "3.1.2", "3.1.3.1"]
    parser_phases: [read, namespaces]
    variation_axes:
      grammar_form: [default-namespace]
      keynames: [present, duplicate, reserved]
      yaml_type_equivalence_classes: [string, non-string]
      resolution: [local, normative, imported-qualified, unresolved]
      collisions: [local-duplicate, imported-ambiguous]
    fixtures:
      - TOSCA13-CORPUS-NAMESPACE-DEFAULT-VALID
      - TOSCA13-CORPUS-NAMESPACE-RESERVED-INVALID
      - TOSCA13-CORPUS-LOCAL-DUPLICATE-NAME-INVALID
      - TOSCA13-CORPUS-IMPORT-LONG-QUALIFIED-VALID
      - TOSCA13-CORPUS-IMPORT-UNKNOWN-QUALIFIED-INVALID
      - TOSCA13-CORPUS-IMPORT-COLLISION-INVALID
    status: complete

  - entity: import-definition
    sections: ["3.6.8.1", "3.6.8.2.2", "3.6.8.2.3"]
    parser_phases: [read, namespaces]
    variation_axes:
      grammar_form: [short, long]
      keynames: [file, namespace_prefix]
      yaml_type_equivalence_classes: [string, mapping, scalar-number-invalid]
      graph: [direct, transitive, duplicate-idempotent, cycle]
      resolution: [relative, qualified, missing-resource, missing-name]
      version_isolation: [tosca-1.3, incompatible-tosca-2.0]
    fixtures:
      - TOSCA13-CORPUS-IMPORT-SHORT-VALID
      - TOSCA13-CORPUS-IMPORT-LONG-QUALIFIED-VALID
      - TOSCA13-CORPUS-IMPORT-WRONG-YAML-TYPE-INVALID
      - TOSCA13-CORPUS-IMPORT-MISSING-FILE-INVALID
      - TOSCA13-CORPUS-IMPORT-UNKNOWN-QUALIFIED-INVALID
      - TOSCA13-CORPUS-IMPORT-TRANSITIVE-VALID
      - TOSCA13-CORPUS-IMPORT-CYCLE-INVALID
      - TOSCA13-CORPUS-IMPORT-DUPLICATE-IDEMPOTENT-VALID
      - TOSCA13-CORPUS-IMPORT-COLLISION-INVALID
      - TOSCA13-CORPUS-IMPORT-DIFFERENT-VERSION-INVALID
    status: complete

  - entity: version
    sections: ["3.3.2.1", "3.3.2.5"]
    parser_phases: [rendering, normalization]
    variation_axes:
      components: [major-zero, minor-zero, qualifier]
      boundaries: [zero-sentinel, zero-with-qualifier-invalid]
    fixtures: [TOSCA13-CORPUS-VERSION-ZERO-VALID, TOSCA13-CORPUS-VERSION-QUALIFIED-ZERO-INVALID]
    status: complete

  - entity: range
    sections: ["3.3.3.1"]
    parser_phases: [rendering, normalization]
    variation_axes:
      bounds: [equal, ordered, reversed, UNBOUNDED]
      yaml_type_equivalence_classes: [two-integers, integer-and-UNBOUNDED]
    fixtures: [TOSCA13-CORPUS-RANGE-BOUNDARIES-VALID, TOSCA13-CORPUS-RANGE-REVERSED-INVALID]
    status: complete

  - entity: map
    sections: ["3.3.5.1.2"]
    parser_phases: [rendering, normalization]
    variation_axes:
      entries: [keyed, unkeyed-invalid]
      cardinality: [multiple]
    fixtures: [TOSCA13-CORPUS-MAP-KEYED-VALID, TOSCA13-CORPUS-MAP-UNKEYED-INVALID]
    status: complete

  - entity: scalar-unit
    sections: ["3.3.6.1", "3.3.6.2"]
    parser_phases: [rendering, normalization]
    variation_axes:
      whitespace: [none, multiple]
      components: [scalar-and-unit, missing-unit]
      constraints: [unit-converted-inclusive-boundary]
    fixtures:
      - TOSCA13-CORPUS-SCALAR-UNIT-WHITESPACE-VALID
      - TOSCA13-CORPUS-SCALAR-UNIT-MISSING-UNIT-INVALID
      - TOSCA13-CORPUS-SCALAR-UNIT-CONSTRAINT-BOUNDARY-VALID
    status: complete

  - entity: inherited-required-keynames
    sections: ["3.5.1"]
    parser_phases: [inheritance]
    variation_axes:
      definition: [direct-parent, refined-child]
      required_key: [inherited]
    fixtures: [TOSCA13-CORPUS-INHERITED-REQUIRED-KEY-VALID]
    status: complete
