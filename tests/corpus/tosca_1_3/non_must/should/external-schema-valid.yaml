tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  ExternalSchemaNode:
    derived_from: tosca.nodes.Root
    properties:
      payload:
        type: json
        constraints:
          - schema: >-
              {"$schema":"http://json-schema.org/draft-04/schema#","type":"object","required":["name"],"properties":{"name":{"type":"string"}}}
topology_template:
  node_templates:
    node:
      type: ExternalSchemaNode
      properties:
        payload: '{"name":"valid"}'
