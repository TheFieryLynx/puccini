tosca_definitions_version: tosca_simple_yaml_1_3
interface_types:
  Test:
    operations:
      run: {}
      keep: {}
relationship_types:
  Link:
    derived_from: tosca.relationships.Root
    interfaces:
      Test:
        type: Test
node_types:
  Source:
    derived_from: tosca.nodes.Root
    requirements:
      - link:
          capability: tosca.capabilities.Node
          relationship: Link
topology_template:
  relationship_templates:
    shared:
      type: Link
      interfaces:
        Test:
          operations:
            run: parent.sh
            keep: unrelated.sh
  node_templates:
    target: {type: tosca.nodes.Root}
    source:
      type: Source
      requirements:
        - link:
            node: target
            relationship:
              type: shared
              interfaces:
                Test:
                  operations:
                    run: {description: no override}
