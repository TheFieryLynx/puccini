tosca_definitions_version: tosca_simple_yaml_1_3
data_types:
  CustomCredential:
    derived_from: tosca.datatypes.Credential
  GrandchildCredential:
    derived_from: CustomCredential
node_types:
  Holder:
    derived_from: tosca.nodes.Root
    properties:
      credential: {type: tosca.datatypes.Credential}
      derived: {type: GrandchildCredential}
topology_template:
  node_templates:
    n:
      type: Holder
      properties:
        credential: {token: secret, token_type: password}
        derived: {token: other, user: audit}
