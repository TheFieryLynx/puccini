tosca_definitions_version: tosca_simple_yaml_1_3
capability_types:
  ParentOS:
    derived_from: tosca.capabilities.OperatingSystem
    properties:
      architecture: {default: AMD64}
      type: {default: LINUX}
      distribution: {default: Debian}
  ChildOS:
    derived_from: ParentOS
node_types:
  Holder:
    capabilities:
      os: ChildOS
topology_template:
  node_templates:
    n: {type: Holder}
