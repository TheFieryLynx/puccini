tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  RangeHolder:
    derived_from: tosca.nodes.Root
    properties:
      finite:
        type: range
      open:
        type: range
topology_template:
  node_templates:
    node:
      type: RangeHolder
      properties:
        finite: [0, 0]
        open: [1, UNBOUNDED]
