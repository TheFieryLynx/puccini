tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  Constrained:
    derived_from: tosca.nodes.Root
    properties:
      count:
        type: integer
        constraints:
          - greater_or_equal: 1
          - less_or_equal: 10
      names:
        type: list
        entry_schema:
          type: string
        constraints:
          - length: 2
topology_template:
  node_templates:
    node:
      type: Constrained
      properties:
        count: 10
        names: [one, two]
