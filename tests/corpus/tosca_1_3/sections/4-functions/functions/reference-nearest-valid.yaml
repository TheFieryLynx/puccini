tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  WithProperty:
    derived_from: tosca.nodes.Root
    properties: {absent: {type: string, default: value}}
topology_template:
  node_templates:
    node:
      type: WithProperty
  outputs:
    result:
      value: { get_property: [node, absent] }
