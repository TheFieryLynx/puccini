tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  Holder:
    derived_from: tosca.nodes.Root
    properties:
      value:
        type: string
        constraints: [{ min_length: 1 }]
topology_template:
  inputs:
    supplied: { type: string, default: value }
  node_templates:
    node:
      type: Holder
      properties:
        value: { get_input: supplied }
