tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  Parent:
    derived_from: tosca.nodes.Root
    properties:
      label:
        type: string
        default: inherited
        constraints:
          - min_length: 1
  Child:
    derived_from: Parent
topology_template:
  node_templates:
    node:
      type: Child
  outputs:
    label:
      value: { get_property: [node, label] }
