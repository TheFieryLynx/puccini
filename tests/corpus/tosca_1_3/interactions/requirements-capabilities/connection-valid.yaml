tosca_definitions_version: tosca_simple_yaml_1_3
capability_types:
  CorpusEndpoint: { derived_from: tosca.capabilities.Root }
node_types:
  Target:
    derived_from: tosca.nodes.Root
    capabilities:
      endpoint: CorpusEndpoint
  Source:
    derived_from: tosca.nodes.Root
    requirements:
      - target:
          capability: CorpusEndpoint
          occurrences: [1, 1]
topology_template:
  node_templates:
    target: { type: Target }
    source:
      type: Source
      requirements:
        - target: target
