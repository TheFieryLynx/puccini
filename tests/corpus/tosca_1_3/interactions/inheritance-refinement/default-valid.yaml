tosca_definitions_version: tosca_simple_yaml_1_3
node_types:
  Parent:
    derived_from: tosca.nodes.Root
    properties:
      value: { type: string, required: false, default: parent }
  Child:
    derived_from: Parent
    properties:
      value: { default: child }
topology_template:
  node_templates:
    node: { type: Child }
