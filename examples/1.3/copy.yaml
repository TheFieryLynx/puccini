tosca_definitions_version: tosca_simple_yaml_1_3

# "copy" is a convience feature that works like a YAML copy-and-merge
# It is available for both node templates and relationship templates
# The YAML is copied from the source to the target *before* applying the changes
# Note that during the merge of values lists are replaced, not appended to
# TOSCA 1.3 requires the source to be a complete template, so copy chains are
# intentionally limited to one edge.

metadata:

  template_name: Copy Example
  template_author: Puccini

node_types:

  Machine:
    properties:
      cpu:
        type: CPU

data_types:

  CPU:
    properties:
      architecture:
        type: string
      cores:
        type: integer

topology_template:

  node_templates:

    server1:
      type: Machine
      properties:
        cpu:
          architecture: x86
          cores: 4

    server2:
      copy: server1
      properties:
        cpu:
          cores: 8

    client:
      copy: server1
      properties:
        cpu:
          architecture: ARM
          cores: 8
